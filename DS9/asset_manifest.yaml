version: 1
deepstream:
  required_major: 9
  required_home: /opt/nvidia/deepstream/deepstream-9.0
  required_tensorrt: 10.14.1.48
  python: "3.12"

runtime:
  entrypoint: DS9/noesis/ds9_runtime.py
  pipeline_config: DS9/config/infer.yaml
  preflight: DS9/scripts/ds9_preflight.py

native_extensions:
  output_dir: DS9/native_extensions
  build_script: DS9/scripts/build_native_extensions.sh
  modules:
    - noesis_pose_meta_ext
    - noesis_v3dt_meta_ext
    - noesis_reid_meta_ext
    - noesis_latency_ext
    - noesis_depth_meta_ext
    - noesis_depth_tracking_tensor_ext

custom_parsers:
  build_script: DS9/scripts/build_custom_parsers.sh
  outputs:
    - DS9/pipelines/nvdsinfer_yolo11_seg/libnvdsinfer_yolo11_seg.so
    - DS9/pipelines/nvdsinfer_yolo26_seg/libnvdsinfer_yolo26_seg.so
    - DS9/pipelines/nvdsinfer_yolo_detect/libnvdsparsebbox_yolo.so
    - DS9/pipelines/nvdsinfer_rfdetr/libnvdsinfer_rfdetr.so
    - DS9/pipelines/nvdsinfer_rfdetr_seg/libnvdsinfer_rfdetr_seg.so

custom_gstreamer_plugins:
  build_script: DS9/scripts/build_gst_plugins.sh
  outputs:
    - DS9/gst-plugins/libgstnvdsroiexclude.so

custom_tensorrt_plugins:
  build_script: DS9/scripts/build_trt_plugins.sh
  outputs:
    - DS9/plugins/libnvdsinfer_custom_impl_Yolo_seg.so

engines:
  rebuild_script: DS9/scripts/rebuild_engines.py
  outputs:
    - DS9/models/engines/yolo11s-seg_cust_fused.engine
    - DS9/models/engines/yolo11m_b3_fp16.engine
    - DS9/models/engines/reid_osnet_ibn_msmt17_dyn_b16_fp16.engine
    - DS9/models/engines/yolo26n-pose_b3_fp16.engine
    - DS9/models/engines/depth_anything_v2_metric_hypersim_vits_294x518_b3_fp16.engine
    - DS9/models/engines/mapanything_images_294x518_b3_fp16.plan
    - DS9/models/engines/yolo26n-seg_fused_b3_fp16.engine
    - DS9/models/engines/yolo26s-seg_fused_b3_fp16.engine
    - DS9/models/engines/yolo26m-seg_fused_b3_fp16.engine
    - DS9/models/engines/yolo26n_b3_fp16.engine
    - DS9/models/engines/yolo26s_b3_fp16.engine
    - DS9/models/engines/yolo26m_b3_fp16.engine
    - DS9/models/engines/yolo26l_b3_fp16.engine
    - DS9/models/engines/yolo26x_b3_fp16.engine
    - DS9/models/engines/rfdetr_n_384_b3_fp16.engine
    - DS9/models/engines/rfdetr_s_512_b3_fp16.engine
    - DS9/models/engines/rfdetr_m_576_b3_fp16.engine
    - DS9/models/engines/rfdetr_seg_n_312_b3_fp16.engine
    - DS9/models/engines/rfdetr_seg_s_384_b3_fp16.engine
    - DS9/models/engines/rfdetr_seg_m_432_b3_fp16.engine

shared_app_data:
  configs:
    - config/cameras.yaml
    - config/depth_registration.json
    - config/nvtracker.yaml
    - config/config_nvdsanalytics_post.ini
    - config/nvdsanalytics.yaml
    - config/config_nvdsanalytics_exclude.ini
  source_models:
    - DS9/models/onnx/yolo11m.onnx
    - DS9/models/onnx/yolo26n.onnx
    - DS9/models/onnx/yolo26s.onnx
    - DS9/models/onnx/yolo26m.onnx
    - DS9/models/onnx/yolo26l.onnx
    - DS9/models/onnx/yolo26x.onnx
    - models/yolo11s-seg_cust_fused.onnx
    - models/engines/reid_osnet_ibn_msmt17_dyn_b16.onnx
    - DS9/models/onnx/yolo26n-pose_b3.onnx
    - models/onnx/depth_anything_v2_metric_hypersim_vits_294x518_b3.onnx
    - DS9/models/onnx/mapanything_images_294x518_b3.onnx
    - models/yolo26n-seg_fused.onnx
    - models/yolo26s-seg_fused.onnx
    - models/yolo26m-seg_fused.onnx
    - DS9/models/onnx/rfdetr_n_384.onnx
    - DS9/models/onnx/rfdetr_s_512.onnx
    - DS9/models/onnx/rfdetr_m_576.onnx
    - models/onnx/rfdetr_seg_n_312.onnx
    - models/onnx/rfdetr_seg_s_384.onnx
    - models/onnx/rfdetr_seg_m_432.onnx

packaging_boundary:
  ds9_runtime_entrypoint: DS9/noesis/ds9_runtime.py
  ds9_runtime_core: DS9/noesis/ds9_runtime_core.py
  forbidden_runtime_entrypoint: noesis/ds8_runtime.py
  still_shared_parent_repo_context:
    - config/cameras.yaml
    - calibration and geometry helper modules
    - WebSocket server module
    - selected root validation clients
