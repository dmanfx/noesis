# DeepStream 9 canonical configuration for the Noesis Service Maker pipeline.
# DS9-specific parser libraries, generated INIs, and TensorRT engines live under DS9/.

version: 1

depth_registration:
  path: DS9/config/depth_registration.json

# Immutable scan-derived evidence, bound to cameras in explicit shadow mode.
# Runtime world positions remain producer-owned; the prior adds diagnostics and
# static/composite floorplan layers without replacing live observations.
scene_priors:
  path: ../../data/scene_priors/catalog.json

# Quality-gated fixed-camera + phone-walk diagnostic artifacts. These cached
# layers feed review-only 3D views and never initiate inference or mutate live
# world/tracking state.
scene_fusions:
  path: ../../data/scene_fusions/catalog.json

batch_size: 3

streammux:
  width: 1920
  height: 1080
  batch-size: 3
  live-source: 1
  batched-push-timeout: 40000
  # Eight output surfaces absorb bounded telemetry/ROI timing spikes without
  # starving the mux's output pool (the DeepStream default is only four).
  buffer-pool-size: 8
  enable-padding: 1
  nvbuf-memory-type: 0
  sync-inputs: 0
  gpu-id: 0

# Explicit calibrated validity regions for full-FoV fisheye dewarping. These
# masks prevent border pixels outside the source lens circle from entering
# MapAnything depth/reconstruction evidence.
dewarper_validity_masks:
  sources:
    "0":
      source-valid-region: circle
      source-width: 1920
      source-height: 1080
      erode-px: 1
    "1":
      source-valid-region: circle
      source-width: 1920
      source-height: 1080
      erode-px: 1
    "2":
      source-valid-region: circle
      source-width: 1280
      source-height: 720
      erode-px: 1

sources:
  - element: nvurisrcbin
    uri_secret: living-room
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: DS9/config/dewarper_g3_instant_charuco_1080.txt
  - element: nvurisrcbin
    uri_secret: kitchen
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: DS9/config/dewarper_g3_instant_charuco_1080.txt
  - element: nvurisrcbin
    uri_secret: family-room
    gpu-id: 0
    cudadec-memtype: 0
    # This camera has measured RTSP jitter bursts near 200 ms. Keep the
    # jitter-buffer drop policy bounded while absorbing those bursts instead
    # of presenting a frozen tile followed by a position jump.
    latency: 250
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: DS9/config/dewarper_g4_instant_charuco_720_to_1080.txt

preprocess:
  enable: true
  config-file: DS9/pipelines/config_preproc_yolo26_m.ini

models:
  pgie:
    config-file-path: DS9/pipelines/config_infer_primary_yolo26_m.ini
    engine: DS9/models/engines/yolo26m_b3_fp16.engine
    batch_size: 3
    gie_id: 1
    network_mode: fp16
    attach_tensor_meta: false
  reid:
    enable: true
    name: reid_sgie
    config-file-path: DS9/pipelines/config_infer_secondary_reid_swin.ini
    engine: DS9/models/engines/reid_swin_tiny_aicity156_dyn_b16_fp16.engine
    batch_size: 16
    gie_id: 3
    layer: fc_pred
    embedding_dim: 256
    attach_tensor_meta: true
  pose:
    enable: true
    name: yolo26_pose
    config-file-path: DS9/pipelines/config_infer_secondary_yolo26_pose.ini
    engine: DS9/models/engines/yolo26n-pose_b3_fp16.engine
    batch_size: 3
    gie_id: 4
    attach_tensor_meta: true
    model_size: [640, 640]
    score_threshold: 0.25
    kpt_threshold: 0.35
    letterbox: true
  depth_tracking:
    enable: true
    name: depth_tracking_fullframe
    config-file-path: DS9/pipelines/config_infer_secondary_depth_tracking_da2.ini
    engine: DS9/models/engines/depth_anything_v2_metric_hypersim_vits_294x518_b3_fp16.engine
    batch_size: 3
    gie_id: 5
    attach_tensor_meta: true
  mapanything:
    enable: true
    name: mapanything_fullframe
    config-file-path: DS9/pipelines/config_infer_secondary_mapanything.ini
    engine: DS9/models/engines/mapanything_images_294x518_b3_fp32.plan
    batch_size: 3
    gie_id: 2
    attach_tensor_meta: true

tracker:
  config-file: DS9/config/nvtracker.yaml
  ll-lib-file: /opt/nvidia/deepstream/deepstream-9.1/lib/libnvds_nvmultiobjecttracker.so

analytics:
  enable: true
  config-file: config/config_nvdsanalytics_post.ini
  stages_config: config/nvdsanalytics.yaml
  exclude:
    enable: true
    element: nvdsroiexclude
    config-file: config/config_nvdsanalytics_exclude.ini

canonical_world:
  # One camera-agnostic resolver receives every credible floor/depth/pose
  # hypothesis.  The historical per-room policy is not part of the active
  # canonical baseline.
  measurement_resolver:
    enabled: true
    max_range_m: 22.0
    max_disagreement_m: 1.25
    max_candidates: 4
    # Diagnostic-only reconstruction of the retired room policy. It is
    # evaluated from the resolver's existing compact candidates only while a
    # dashboard requests Localization details; it never feeds track.world.
    legacy_comparison_policy_path: config/world_measurement_fusion_policy.json
  person_admission:
    min_unposed_detection_confidence: 0.50
  provisional_handoff:
    max_distance_m: 1.0

sinks:
  - name: mosaic_sink
    type: fakesink
    sync: false
  - name: bev_sink
    type: fakesink
    sync: false

mosaic_output:
  rtsp_enabled: false
  rtsp_port: 8554
  rtsp_path: mosaic
  mosaic_webrtc_enabled: true
  mosaic_h264_shm_socket: /tmp/noesis-mosaic-h264
  mosaic_h264_shm_size_bytes: 67108864
  video_bitrate_kbps: 12000  # Quality floor for the 3840x720, 30 fps, short-GOP mosaic
  encoder: nvv4l2h264enc
  h264_iframeinterval: 10
  h264_idrinterval: 10
  h264_preset_id: 4
  h264_profile: 0

bev:
  frame: camera_local_ground_m
  jpeg_enabled: false
  jpeg_quality: 70
  coverage_envelopes:
    contract: noesis.bev.coverage_envelopes
    contract_version: 1
    frame: camera_local_ground_m
    units: meters
    cameras:
      living-room:
        boundary_tolerance_m: 0.35
        regions:
          - id: living-room
            polygon_xz_m:
              - [6.485358, 1.927884]
              - [-1.583682, 0.127085]
              - [-2.694162, 4.769288]
              - [5.374878, 6.570087]
          - id: foyer
            polygon_xz_m:
              - [0.494046, 5.416398]
              - [-4.741911, 4.247869]
              - [-5.825244, 8.776586]
              - [-0.589286, 9.945115]
  smoothing:
    enabled: true
    max_speed_mps: 4.0
    max_jump_m: 0.75
    alpha: 0.45
    beta: 0.10
    ttl_s: 2.5
    reset_after_s: 1.25

osd:
  process-mode: 1
  display-mask: 1
  display-bbox: 0
  display-text: 1

visualization:
  display_keypoints: true
  instance_masks:
    alpha: 0.35
  trails:
    enabled: true
    anchor_mode: floor_plane_gravity_drop
    class_ids: [0]
    window_s: 8.0
    draw_stride: 1
    min_step_px: 1.0
    min_dt_s: 0.08
    smooth_tau_s: 0.18
    gap_predict_ttl_s: 0.0
    gap_predict_decay_tau_s: 0.75
    predicted_alpha_scale: 0.65
    height_peak_up_alpha: 0.35
    height_peak_down_alpha: 0.05
    height_good_frame_ratio: 0.90
    head_smooth_tau_s: 0.06
    trail_smooth_tau_s: 0.19
    min_step_scene_floor: 0.0
    min_step_scene_ceil: 0.11
    stale_head_blink_enabled: false
    max_speed_px_per_s: 1200.0
    max_points_per_track: 257
    max_segments_per_track: 64
    max_tracks: 8
    max_lines: 800
    max_display_metas: 32
    line_width: 3
    min_alpha: 0.15
    show_labels: false
    color_key: stable_id
  osd_labels:
    font_size: 18
    font_name: Serif
    decimals: 2
