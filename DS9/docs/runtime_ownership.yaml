capabilities:
  - id: cli.core_runtime_options
    surface: cli
    status: parity
    evidence:
      repository_source:
        ds8:
          path: noesis/ds8_runtime.py
          contains_all: [--pipeline-config, --pgie-profile, --size, --cameras-config, --tracking-mode, --enable-rest, --disable-rest]
        ds9:
          path: DS9/noesis/ds9_runtime_core.py
          contains_all: [--pipeline-config, --pgie-profile, --size, --cameras-config, --tracking-mode, --enable-rest, --disable-rest]
  - id: cli.pgie_profile_underscore_alias
    surface: cli
    status: parity
    evidence:
      repository_source:
        ds8: {path: noesis/ds8_runtime.py, contains_all: [--pgie_profile]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [--pgie_profile]}
  - id: config.canonical_model_roles
    surface: config
    status: parity
    evidence:
      repository_source:
        ds8:
          path: config/infer.yaml
          yaml_keys: [models.pgie, models.reid, models.pose, models.depth_tracking, models.mapanything]
        ds9:
          path: DS9/config/infer.yaml
          yaml_keys: [models.pgie, models.reid, models.pose, models.depth_tracking, models.mapanything]
  - id: config.local_bev_frame
    surface: config
    status: parity
    evidence:
      repository_source:
        ds8: {path: config/infer.yaml, yaml_equals: {bev.frame: camera_local_ground_m}}
        ds8_v3dt: {path: config/infer_v3dt_baseline.yaml, yaml_equals: {bev.frame: camera_local_ground_m}}
        ds9: {path: DS9/config/infer.yaml, yaml_equals: {bev.frame: camera_local_ground_m}}
        ds9_v3dt: {path: DS9/config/infer_v3dt.yaml, yaml_equals: {bev.frame: camera_local_ground_m}}
    notes: Inline BEV panels are locked to the active floorplan's camera-local ground frame in DS8, protected V3DT, and DS9. Before first authority, startup_pending emits no local BEV; post-ready loss is fatal. An exact empty frame is active success. The separate canonical world snapshot remains backend_world_m.
  - id: depth.dewarper_validity_masks
    surface: config
    status: parity
    evidence:
      repository_source:
        ds8: {path: config/infer.yaml, yaml_keys: [dewarper_validity_masks.sources.0, dewarper_validity_masks.sources.1, dewarper_validity_masks.sources.2]}
        ds9: {path: DS9/config/infer.yaml, yaml_keys: [dewarper_validity_masks.sources.0, dewarper_validity_masks.sources.1, dewarper_validity_masks.sources.2]}
  - id: api.depth_refresh
    surface: api
    status: parity
    evidence:
      repository_source:
        ds8: {path: noesis/server/depth_api.py, contains_all: ["@app.post", /api/v1/depth/refresh]}
        ds9: {path: DS9/noesis/server/depth_api.py, contains_all: ["@app.post", /api/v1/depth/refresh]}
  - id: api.internal_gateway_auth
    surface: security
    status: shared
    evidence:
      repository_source:
        shared: {path: noesis/server/internal_auth.py, contains_all: [InternalBearerAuthMiddleware, NOESIS_INTERNAL_AUTH_MODE]}
        ds8: {path: noesis/ds8_runtime.py, contains_all: [configure_internal_rest_app(app), NOESIS_REST_CORS_ALLOW_ALL is forbidden]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [configure_internal_rest_app(app), NOESIS_REST_CORS_ALLOW_ALL is forbidden]}
  - id: api.analytics_roi
    surface: api
    status: parity
    evidence:
      repository_source:
        ds8: {path: noesis/server/analytics_api.py, contains_all: [/api/v1/analytics/rois]}
        ds9: {path: DS9/noesis/server/analytics_api.py, contains_all: [/api/v1/analytics/rois]}
  - id: api.reid_aliases
    surface: api
    status: parity
    evidence:
      repository_source:
        ds8: {path: noesis/server/reid_api.py, contains_all: [/api/v1/reid/aliases/merge, /api/v1/reid/aliases/history]}
        ds9: {path: DS9/noesis/server/reid_api.py, contains_all: [/api/v1/reid/aliases/merge, /api/v1/reid/aliases/history]}
  - id: api.household_identity
    surface: api
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis/server/reid_v2_api.py
          contains_all: ['prefix="/api/v2/reid"', '@router.get("/residents"', identity_v2_health]
        ds8:
          path: noesis/ds8_runtime.py
          contains_all: [app.include_router(reid_v2_api.router), create_identity_v2_service]
        ds9:
          path: DS9/noesis/ds9_runtime_core.py
          contains_all: [app.include_router(reid_v2_api.router), create_identity_v2_service]
    notes: DS8 and DS9 mount one shared family-biased open-set identity API and runtime. Authoritative startup remains scoring-calibration-gated by design; that is product state, not DS9 drift.
  - id: identity.camera_topology_validation
    surface: identity
    status: parity
    evidence:
      repository_source:
        ds8: {path: noesis/ds8_runtime.py, contains_all: [camera_labels=camera_labels]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [camera_labels=camera_labels, 'extra_kwargs["camera_labels"]']}
  - id: api.virtual_twin
    surface: api
    status: shared
    evidence:
      repository_source:
        shared: {path: noesis/server/virtual_twin_api.py, contains_all: [/api/v1/virtual-twin/revisions]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [virtual_twin_api.app.router]}
  - id: telemetry.core_message_types
    surface: telemetry
    status: parity
    evidence:
      repository_source:
        ds8:
          path: noesis/telemetry/publishers.py
          contains_all: ['"type": "depth_result"', '"type": "tracking"']
        ds9:
          path: DS9/noesis/telemetry/publishers.py
          contains_all: ['"type": "depth_result"', '"type": "tracking"']
  - id: telemetry.canonical_world_snapshot
    surface: telemetry
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis_core/runtime_world.py
          contains_all: [create_runtime_world_service, tracking_model_manifest, camera_calibration]
        ds8:
          path: noesis/ds8_runtime.py
          contains_all: [create_runtime_world_service, 'runtime="ds8"', world_service=world_service]
        ds9:
          path: DS9/noesis/ds9_runtime_core.py
          contains_all: [create_runtime_world_service, 'runtime="ds9"', world_service=world_service]
  - id: telemetry.public_frame_time_identity
    surface: telemetry
    status: parity
    evidence:
      repository_source:
        ds8:
          path: noesis/pipelines/hooks.py
          contains_all: [observed_at_us, capture_time_status, media_pts_ns, visitor_generation]
        ds9:
          path: DS9/noesis/telemetry/world_contract_adapter.py
          contains_all: [observed_at_us, capture_time_status, media_pts_ns, visitor_generation]
  - id: health.canonical_capability_progress
    surface: api
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis/server/health_api.py
          contains_all: [/api/v1/health/capabilities, register_capability_monitor_getter]
        ds8:
          path: noesis/ds8_runtime.py
          contains_all: [create_runtime_capability_monitor, health_monitor=capability_monitor, health_api.router]
        ds9:
          path: DS9/noesis/ds9_runtime_core.py
          contains_all: [create_runtime_capability_monitor, health_monitor=capability_monitor, health_api.router]
  - id: api.scene_releases
    surface: api
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis/server/scene_api.py
          contains_all: [/api/v1/scenes, /releases, /current, /history, /promote, /rollback]
        ds8: {path: noesis/ds8_runtime.py, contains_all: [scene_api.router]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [scene_api.router]}
  - id: telemetry.bev_contract
    surface: telemetry
    status: shared
    evidence:
      repository_source:
        canonical:
          path: noesis/telemetry/bev.py
          python_import_origin:
            module: noesis.telemetry.bev
            expected_path: noesis/telemetry/bev.py
            prepend_paths: [DS9, .]
    notes: With BEV active, effective cadence is max of the selected tracking and BEV intervals. One immutable finite-only tracking/world/event batch receives typed bounded sender admission but remains behind a one-shot release gate until synchronous exact-count journal and private world commit; paired BEV then carries that exact source/frame/time/sequence/submission cohort and must receive a later admission ID. Pre-admission failure is retryable without sequence mutation; post-admission authority failure aborts with zero delivery and poisons publication. Count/lifecycle changes force the pair. Registered depth and calibration-image scaling are shared contract behavior, not DS9-local alternatives.
  - id: telemetry.person_ground_state
    surface: telemetry
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis/telemetry/person_ground_state.py
          contains_all: [HumanGroundConfig, PersonGroundState, update_human_cv_filter, commit_path_point]
        ds8:
          path: noesis/pipelines/hooks.py
          contains_all: [from noesis.telemetry.person_ground_state import, update_human_cv_filter, apply_source_hysteresis]
        ds9:
          path: DS9/noesis/pipelines/hooks.py
          contains_all: [from noesis.telemetry.person_ground_state import, update_human_cv_filter, apply_source_hysteresis]
        shared_bev:
          path: noesis/telemetry/bev.py
          contains_all: [commit_path_point, trail_append_allowed, idle_jitter_m]
  - id: model.wholebody49_profile
    surface: cli
    status: parity
    evidence:
      repository_source:
        shared:
          path: noesis/deimv2_wholebody49_assets.py
          contains_all: [WHOLEBODY49_SIZES, validate_wholebody49_pgie_properties, NOESIS_ENGINE_DIR]
        ds8: {path: noesis/ds8_runtime.py, contains_all: [wholebody49, _shared_materialize_wholebody49_configs]}
        ds9: {path: DS9/noesis/ds9_runtime_core.py, contains_all: [wholebody49, _shared_materialize_wholebody49_configs, _validate_wholebody49_pgie_properties]}
        ds9_parser:
          path: DS9/pipelines/nvdsinfer_deimv2_wholebody49/nvdsinfer_deimv2_wholebody49.cpp
          contains_all: [NvDsInferParseDeimv2Wholebody49, NvDsInferParseDeimv2Wholebody49Boxes]
    acceptance:
      owner: detector-profiles
      reason: The DS9 TensorRT 10.14 S-mask and X-box engines are provenance-complete and the authoritative wholebody49 artifact profile passes. Fresh checksum-replayable occupied-scene v2, direct RTSP plus WebRTC decoded-media, and 300-second resource-soak evidence is still absent for both lanes.
      exit_criteria: Promote fresh wholebody49-s and wholebody49-x sessions only when each exact container, checkout, realization, primary engine, and config cohort passes occupied mask-or-box semantics, all-source advancing frames at the provisional 2 fps and 2.5-second liveness floors, decoded media, zero CPU-copy violations, clean acknowledged shutdown, and the provisional fail-closed memory/resource ceilings. These bounds are policy floors and ceilings, not empirical model-performance claims.
  - id: model.reid_profile
    surface: config
