schema_version: 1
matrix_id: noesis-ds9-native-runtime-ownership
updated_at: "2026-08-26"

policy:
  canonical_runtime: ds9_native_host
  entrypoint: DS9/noesis/ds9_runtime.py
  implementation: DS9/noesis/ds9_runtime_core.py
  supervisor: DS9/scripts/run_canonical_runtime_host.py
  pipeline_config: DS9/config/infer.yaml
  allowed_module_classifications:
    - shared_single_source
    - ds9_adapter
  scan_roots:
    - DS9/noesis
    - DS9/scripts
    - noesis
    - noesis_core
    - scripts
  scan_suffixes: [.py, .sh]
  forbidden_active_references:
    - id: ds8_runtime
      regex: '(?:noesis[/.]ds8_runtime|ds8_runtime\.py)'
      reason: The DS8 executable runtime is retired.
      allow_paths:
        - DS9/scripts/run_canonical_runtime_host.py
        - DS9/scripts/run_static_prep_checks.sh
        - scripts/check_agents_docs_consistency.py
    - id: ds8_preflight
      regex: '(?:noesis[/.]ds8_preflight|ds8_preflight\.py)'
      reason: Native DS9.1 owns preflight and launch policy.
      allow_paths:
        - DS9/scripts/run_static_prep_checks.sh
        - scripts/check_agents_docs_consistency.py
    - id: container_launcher
      regex: 'run_canonical_runtime_container\.py'
      reason: The canonical runtime is native-host only.
    - id: docker_runtime
      regex: '(?:DS9/docker|secondary_docker\.sh|build_secondary_(?:dev|runtime)_image\.sh|validate_runtime_secrets_container\.sh)'
      reason: Container build and execution paths are retired.

modules:
  - id: adapter.runtime_entrypoint
    classification: ds9_adapter
    owner_path: DS9/noesis/ds9_runtime.py
  - id: adapter.runtime_core
    classification: ds9_adapter
    owner_path: DS9/noesis/ds9_runtime_core.py
  - id: adapter.runtime_config
    classification: ds9_adapter
    owner_path: DS9/noesis/runtime_config.py
  - id: adapter.pipeline
    classification: ds9_adapter
    owner_path: DS9/noesis/pipelines/deepstream_pipeline.py
  - id: adapter.pipeline_hooks
    classification: ds9_adapter
    owner_path: DS9/noesis/pipelines/hooks.py
  - id: adapter.native_sources
    classification: ds9_adapter
    owner_path: DS9/native
  - id: adapter.parser_sources
    classification: ds9_adapter
    owner_path: DS9/pipelines
  - id: adapter.gstreamer_sources
    classification: ds9_adapter
    owner_path: DS9/gst-plugins
  - id: shared.product_core
    classification: shared_single_source
    owner_path: noesis_core
  - id: shared.application_services
    classification: shared_single_source
    owner_path: noesis
  - id: shared.data_models
    classification: shared_single_source
    owner_path: noesis/models.py
  - id: shared.mapanything_adapter
    classification: shared_single_source
    owner_path: noesis/adapters/mapanything.py
  - id: shared.semantic_capture
    classification: shared_single_source
    owner_path: noesis/semantic_capture
  - id: shared.identity_domain
    classification: shared_single_source
    owner_path: reid
  - id: shared.geometry_domain
    classification: shared_single_source
    owner_path: geometry
  - id: shared.websocket_boundary
    classification: shared_single_source
    owner_path: noesis/server/websocket.py
  - id: shared.camera_config
    classification: shared_single_source
    owner_path: config/cameras.yaml

capabilities:
  - id: canonical_pipeline
    status: enabled
    owner_path: DS9/noesis/pipelines/deepstream_pipeline.py
  - id: tracking_world_bev
    status: enabled
    owner_path: DS9/noesis/ds9_runtime_core.py
  - id: websocket_webrtc
    status: enabled
    owner_path: noesis/server/websocket.py
  - id: mv3dt_kitchen_family
    status: opt_in
    owner_path: DS9/config/infer_mv3dt.yaml
  - id: automagic_calibration
    status: deferred
    owner_path: .agents/skills/amc-setup-calibration-stack/SKILL.md
