schema_version: 2
matrix_id: noesis-ds8-ds9-runtime-ownership
updated_at: "2026-07-11"
# Typed evidence contract: DS9/docs/runtime_ownership_evidence.md

policy:
  canonical_runtime_now: ds8
  intended_successor: ds9
  ds8_entrypoint: noesis/ds8_runtime.py
  ds9_entrypoint: DS9/noesis/ds9_runtime.py
  allowed_module_classifications:
    - shared_single_source
    - sdk_adapter
    - duplicated_pending_convergence
  allowed_capability_statuses:
    - parity
    - shared
    - adapter_specific
    - known_gap
    - blocked
  strict_blocking_statuses:
    - known_gap
    - blocked
  forbidden_ds9_imports:
    - id: ds8_runtime_module
      module: noesis.ds8_runtime
      regex: '(?m)^\s*(?:from|import)\s+noesis\.ds8_runtime\b'
      reason: DS9 executable code must never delegate to the DS8 runtime.
    - id: ds8_runtime_path
      regex: 'noesis/ds8_runtime\.py'
      reason: DS9 executable code must not spawn or shell out to the DS8 entrypoint.
    - id: ds8_preflight_module
      module: noesis.ds8_preflight
      regex: '(?m)^\s*(?:from|import)\s+noesis\.ds8_preflight\b'
      reason: DS9 configuration and launch policy must be owned by DS9 or a neutral shared module.
  scan_roots:
    - DS9/noesis
    - DS9/scripts
  scan_suffixes: [.py]

modules:
  # Product/domain modules intentionally consumed from one root implementation.
  - id: shared.calibration_bundle
    classification: shared_single_source
    owner_path: calibration_bundle.py
    rationale: Calibration bundle contracts are SDK-neutral product state.
  - id: shared.depth_storage
    classification: shared_single_source
    owner_path: geometry/depth_source.py
    rationale: Persisted depth and floorplan products must not diverge by SDK.
  - id: shared.dewarper_validity
    classification: shared_single_source
    owner_path: geometry/dewarper_validity.py
    rationale: Calibrated lens-FoV validity is shared geometry, while each SDK adapter supplies its dewarper config path.
  - id: shared.product_core
    classification: shared_single_source
    owner_path: noesis_core
    rationale: Versioned product contracts, replay, world fusion, health, and scene releases must remain SDK-neutral.
  - id: shared.internal_rest_auth
    classification: shared_single_source
    owner_path: noesis/server/internal_auth.py
    rationale: DS8 and DS9 expose one gateway-only internal REST boundary.
  - id: shared.mapanything_config
    classification: shared_single_source
    owner_path: mapanything_config.py
    rationale: MapAnything service policy is SDK-neutral.
  - id: shared.pose_v1
    classification: shared_single_source
    owner_path: noesis/calibration/pose_v1.py
    rationale: World-pose normalization is a shared contract.
  - id: shared.tracking_diagnostics
    classification: shared_single_source
    owner_path: noesis/diagnostics/telemetry_log.py
    rationale: Diagnostics interpret the shared telemetry contract.
  - id: shared.virtual_twin_api
    classification: shared_single_source
    owner_path: noesis/server/virtual_twin_api.py
    rationale: Virtual-twin revisions and API semantics are product-owned.
  - id: shared.person_ground_state
    classification: shared_single_source
    owner_path: noesis/telemetry/person_ground_state.py
    rationale: Human support-point and posture state are world-model behavior.
  - id: shared.canonical_bev_renderer
    classification: shared_single_source
    owner_path: noesis/telemetry/bev.py
    rationale: DS8 and DS9 must resolve one BEV display, active-floorplan authority lifecycle, smoothing, trail, diagnostics, empty-frame activity, and failure-health implementation.
  - id: shared.capture_event_fusion
    classification: shared_single_source
    owner_path: noesis_core/capture_event_fusion.py
    rationale: Capture-event cohorts, raw-only admission, RGB association, and exact fusion evidence are SDK-neutral product behavior.
  - id: shared.wholebody49_profile
    classification: shared_single_source
    owner_path: noesis/deimv2_wholebody49_assets.py
    rationale: Wholebody49 variants, tensor/parser semantics, and config materialization are product contracts parameterized by runtime-owned artifact roots.
  - id: shared.reid_swin_profile
    classification: shared_single_source
    owner_path: noesis/reid_swin_profile.py
    rationale: The TAO Swin-Tiny source, preprocessing, tensor layer/dimension, and SGIE semantics are one product contract; each SDK owns its TensorRT engine.
  - id: shared.canonical_world_service
    classification: shared_single_source
    owner_path: noesis_core/world_service.py
    rationale: Observation normalization and global fusion must have one SDK-neutral owner.
  - id: shared.runtime_world_factory
    classification: shared_single_source
    owner_path: noesis_core/runtime_world.py
    rationale: Producer identity and calibration/model/config fingerprints must be built identically for DS8 and DS9.
  - id: shared.capability_health_api
    classification: shared_single_source
    owner_path: noesis/server/health_api.py
    rationale: Capability readiness is based on canonical producer progress, not an SDK-specific socket check.
  - id: shared.scene_release_api
    classification: shared_single_source
    owner_path: noesis/server/scene_api.py
    rationale: Atomic multi-camera scene releases and promotion history are product state shared by every runtime.
  - id: shared.websocket_server
    classification: shared_single_source
    owner_path: websocket_server.py
    rationale: WebSocket and WebRTC signaling contracts must be identical, including finite immutable sender admission, the global frozen-byte budget, zero-byte quiescence, and the bounded telemetry-client set with health bypass.
  - id: shared.identity_domain
    classification: shared_single_source
    owner_path: reid
    rationale: Resident, visitor, gallery, and assignment state are product-owned.
  - id: shared.validation
    classification: shared_single_source
    owner_path: noesis/validation
    rationale: Both runtimes must be judged by the same validators.

  # SDK-specific composition, compatibility, and native-access surfaces.
  - id: adapter.ds8_runtime
    classification: sdk_adapter
    ds8_path: noesis/ds8_runtime.py
    rationale: DeepStream 8 composition root.
  - id: adapter.ds9_launcher
    classification: sdk_adapter
    ds9_path: DS9/noesis/ds9_runtime.py
    rationale: DeepStream 9 environment and fail-fast composition root.
  - id: adapter.ds9_runtime_core
    classification: sdk_adapter
    ds9_path: DS9/noesis/ds9_runtime_core.py
    rationale: Temporary DS9 runtime adapter pending extraction of the shared application core.
  - id: adapter.ds9_runtime_config
    classification: sdk_adapter
    ds9_path: DS9/noesis/runtime_config.py
    rationale: DS9 path and PGIE/OSD materialization must not import DS8 preflight helpers.
  - id: adapter.ds9_world_contract_fields
    classification: sdk_adapter
    ds9_path: DS9/noesis/telemetry/world_contract_adapter.py
    rationale: DS9 Service Maker frame metadata is normalized into shared observation time and identity fields.
  - id: adapter.ds9_capture_event_rgb_provider
    classification: sdk_adapter
    ds9_path: DS9/noesis/capture_event_rgb_provider.py
    rationale: DS9 may offer only timestamped frames already owned by its active pipeline to the shared fusion coordinator; this adapter cannot open another source.
  - id: adapter.ds9_preflight
    classification: sdk_adapter
    ds9_path: DS9/scripts/ds9_preflight.py
    rationale: DS9 SDK, TensorRT, plugin, parser, and native ABI gate.

  # Known copied modules. Every entry requires an explicit convergence target.
  - id: duplicate.calibration.depth_registration
    classification: duplicated_pending_convergence
    ds8_path: noesis/calibration/depth_registration.py
    ds9_path: DS9/noesis/calibration/depth_registration.py
    reason: DS9 currently carries path/compatibility differences.
    convergence_target: Shared fingerprint semantics with SDK artifact paths supplied by adapters.
  - id: duplicate.calibration.depth_registration_builder
    classification: duplicated_pending_convergence
    ds8_path: noesis/calibration/depth_registration_builder.py
    ds9_path: DS9/noesis/calibration/depth_registration_builder.py
