[property]
# RF-DETR 1.8.3 person detector for DeepStream 9.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=1
gie-unique-id=1
process-mode=1
network-type=0
network-mode=@NETWORK_MODE@
model-color-format=0
input-tensor-from-meta=1
maintain-aspect-ratio=0
symmetric-padding=0
disable-output-host-copy=1
cluster-mode=4

num-detected-classes=1
operate-on-class-ids=0

parse-bbox-func-name=NvDsInferParseRFDETR
custom-lib-path=@CUSTOM_LIB@
output-blob-names=dets;labels
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.4
topk=@TOPK@
