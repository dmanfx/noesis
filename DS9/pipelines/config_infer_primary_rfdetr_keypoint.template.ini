[property]
# RF-DETR 1.8.3 keypoint-preview person detector for DeepStream 9.
#
# The custom bbox parser consumes dets + labels. Raw keypoints remain available
# as PGIE tensor metadata for the reviewed frame/query-to-object bridge.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=0
gie-unique-id=1
process-mode=1
network-type=0
network-mode=@NETWORK_MODE@
model-color-format=0
net-scale-factor=0.00392156862745098
infer-dims=3;576;576
input-tensor-from-meta=0
maintain-aspect-ratio=0
symmetric-padding=0
scaling-filter=1
disable-output-host-copy=0
cluster-mode=4

num-detected-classes=1
operate-on-class-ids=0

parse-bbox-func-name=NvDsInferParseRFDETRKeypoint
custom-lib-path=@CUSTOM_LIB@
output-blob-names=dets;labels;keypoints
output-tensor-meta=1

[class-attrs-all]
pre-cluster-threshold=0.4
topk=@TOPK@
