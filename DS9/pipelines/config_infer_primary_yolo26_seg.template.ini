[property]
# YOLO26 instance segmentation for DeepStream 9.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=3
network-mode=2
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0
disable-output-host-copy=1
cluster-mode=4

num-detected-classes=80
operate-on-class-ids=0

parse-bbox-instance-mask-func-name=NvDsInferParseYolo26Seg
custom-lib-path=@CUSTOM_LIB@
output-instance-mask=1
output-blob-names=output0
segmentation-threshold=0.50
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.99
topk=30
nms-iou-threshold=0.45

[class-attrs-0]
pre-cluster-threshold=0.35
