[property]
# Official Depth Anything 3 DA3Metric-Large manual full-frame depth lane.
# ImageNet normalization is embedded in the exported graph so nvinfer supplies
# RGB pixels in their native 0..255 range. Camera-specific focal scaling is
# applied by the DS9 postprocessor: depth_m = raw_depth * focal_input_px / 300.
gpu-id=0
process-mode=1
interval=89
network-type=100
model-engine-file=DS9/models/engines/da3metric_large_294x518_b3_fp16.engine
batch-size=3
gie-unique-id=2
network-mode=2
model-color-format=0
net-scale-factor=1.0
input-tensor-from-meta=0
infer-dims=3;294;518
output-blob-names=depth;conf;mask
maintain-aspect-ratio=1
symmetric-padding=1
scaling-compute-hw=1
scaling-filter=4
output-tensor-meta=1
disable-output-host-copy=1
