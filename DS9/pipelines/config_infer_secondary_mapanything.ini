[property]
# MapAnything full-frame SGIE for DeepStream 9.
gpu-id=0
process-mode=1
# Keep the DS9 FP32 branch at the same bounded on-demand cadence as DS8: one
# inference every 90 streammux batches (about 0.33 batch/s at 30 fps). This
# preserves the ten-second/two-observation capture contract without starving
# the always-on person-tracking graph.
interval=89
network-type=100
model-engine-file=DS9/models/engines/mapanything_images_294x518_b3_fp32.plan
batch-size=3
gie-unique-id=2
network-mode=0
model-color-format=0
net-scale-factor=0.003921568627
input-tensor-from-meta=0
infer-dims=3;294;518
output-blob-names=depth;conf;mask
maintain-aspect-ratio=1
symmetric-padding=1
# The default GPU transform is nearest-neighbour. MapAnything is unusually
# sensitive to the aliasing that creates while reducing 1920x1080 to 518x291.
# Use the documented GPU Lanczos filter for a stable, antialiased manual lane.
scaling-compute-hw=1
scaling-filter=4
output-tensor-meta=1
