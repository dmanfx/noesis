[property]
# OSNet ReID secondary inference for DeepStream 9.
gpu-id=0
onnx-file=DS9/models/onnx/reid_osnet_ibn_msmt17_dyn_b16.onnx
model-engine-file=DS9/models/engines/reid_osnet_ibn_msmt17_dyn_b16_fp16.engine

batch-size=16
network-mode=2
gie-unique-id=3
process-mode=2
network-type=1

model-color-format=0
net-scale-factor=1.0
infer-dims=3;256;128
maintain-aspect-ratio=0

operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=24
input-object-min-height=48

# Re-infer cadence: keep fresh embeddings for identity changes without running
# OSNet every few frames for stable tracks.
secondary-reinfer-interval=6

output-tensor-meta=1
# Keep tensor metadata on the object/frame that the Python StableID path reads.
# DeepStream async classifier mode delays classifier output and leaves this
# tensor-meta extraction path without usable embeddings.
classifier-async-mode=0
