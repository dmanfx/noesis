[property]
# Canonical NVIDIA TAO ReIdentificationNet Transformer Swin-Tiny SGIE.
# The source/model/tensor/preprocessing contract is identical to DS8; only the
# ONNX and TensorRT engine paths are DS9-owned.
gpu-id=0

onnx-file=../models/onnx/reid_swin_tiny_market1501_aicity156_featuredim256.onnx
model-engine-file=../models/engines/reid_swin_tiny_aicity156_dyn_b16_fp16.engine

batch-size=16
network-mode=2
gie-unique-id=3
process-mode=2
network-type=1

# TAO ReID RGB ImageNet preprocessing: offsets are pixel-space means and the
# scale is 1 / 57.63. Direct 256x128 resize matches TAO training preprocessing.
model-color-format=0
net-scale-factor=0.01735207
offsets=123.675;116.28;103.53
infer-dims=3;256;128
maintain-aspect-ratio=0

operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=24
input-object-min-height=48

# Stable identity consumes about one embedding per second per track; this
# cadence oversupplies fresh tensors without waking the SGIE every frame.
secondary-reinfer-interval=12

# There is deliberately no custom parser. The native bridge reads the raw
# `fc_pred` float tensor (256 values) from object tensor metadata.
output-tensor-meta=1
classifier-async-mode=0
