[property]
enable=1
unique-id=5
target-unique-ids=1
gpu-id=0
process-on-frame=1
output-frame-meta=1
output-tensor-meta=1
network-input-order=0
network-input-shape=@BATCH_SIZE@;3;@RESOLUTION@;@RESOLUTION@
processing-width=@RESOLUTION@
processing-height=@RESOLUTION@
network-color-format=0
tensor-data-type=0
tensor-name=input
scaling-buf-pool-size=6
tensor-buf-pool-size=6
scaling-pool-memory-type=0
scaling-pool-compute-hw=0
scaling-filter=1
maintain-aspect-ratio=0
symmetric-padding=0
custom-lib-path=@PREPROCESS_LIB@
custom-tensor-preparation-function=CustomTensorPreparation

[user-configs]
# Runtime-derived RF-DETR ONNX graphs accept RGB float32 in [0,1] and apply
# the official ImageNet mean/std normalization inside the TensorRT graph.
pixel-normalization-factor=0.00392156862745098
offsets=0;0;0

[group-0]
src-ids=@SRC_IDS@
process-on-roi=0
