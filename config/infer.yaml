# DeepStream 8 inference builder configuration for Noesis full-frame pipeline.
# This file is treated as the single source of truth for PGIE (YOLOv11) and
# SGIE (MapAnything) model definitions consumed by the pyservicemaker scaffold.

version: 1  # Schema revision for the in-house inference builder loader.

batch_size: 3  # Process one camera feed per inference batch.

streammux:
  width: 1920
  height: 1080
  live-source: 1
  gpu-id: 0

#sources:
