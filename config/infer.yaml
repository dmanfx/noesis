  #  gpu-id: 0
  #  cudadec-memtype: 0
  #  live-source: 0  # File source, not live stream

models:
  pgie:
    config-file-path: pipelines/config_infer_primary_yolo11.ini
  mapanything:
    enable: false
analytics:
  enable: false

sinks:
  - type: fakesink  # Placeholder sink for dry runs and CI validation.
    sync: false  # Disable clock sync to maximise pipeline throughput during tests.

# DS8 frame output (GPU JPEG over WebSocket)
output:
  enable_frames: false  # tiled mode disables per-camera WS branches
  codec: jpeg
  jpeg_quality: 85
  overlays: false
