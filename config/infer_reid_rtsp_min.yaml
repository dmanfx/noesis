version: 1

# Minimal RTSP config for validating StableID + OSNet ReID SGIE in DS8.
# - Keeps PGIE + tracker + ReID SGIE + analytics (required for telemetry hook).
# - Disables MapAnything and mosaic RTSP/WebRTC outputs to reduce moving parts.

batch_size: 3

streammux:
  width: 1920
  height: 1080
  batch-size: 3
  live-source: 1
  batched-push-timeout: 40000
  enable-padding: 1
  nvbuf-memory-type: 0
  sync-inputs: 0
  gpu-id: 0

sources:
  - element: nvurisrcbin
    uri: rtsp://192.168.3.214:7447/jdr9oLlBkjyl3gDm?
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
  - element: nvurisrcbin
    uri: rtsp://192.168.3.214:7447/qt3VqVdZpgG1B4Vk?
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
  - element: nvurisrcbin
    uri: rtsp://192.168.3.214:7447/4qWTBhW6b4nLeUFE?
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true

preprocess:
  enable: false

models:
  pgie:
    config-file-path: pipelines/config_infer_primary_yolo11_seg.ini
    engine: /home/mayor/Noesis_Devel/models/engines/yolo11s-seg_cust_fused.engine
    batch_size: 3
    gie_id: 1
    network_mode: fp16
    attach_tensor_meta: false
  reid:
    enable: true
    name: reid_osnet
    config-file-path: pipelines/config_infer_secondary_reid_osnet.ini
    engine: models/engines/reid_osnet_ibn_msmt17_dyn_b16_fp16.engine
    batch_size: 16
    gie_id: 3
    attach_tensor_meta: true
  mapanything:
    enable: false

tracker:
  config-file: config/nvtracker.yaml
  ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so

analytics:
  enable: true
  config-file: config/config_nvdsanalytics_post.ini
  stages_config: config/nvdsanalytics.yaml
  exclude:
    enable: false

sinks:
  - name: mosaic_sink
    type: fakesink
    sync: false

mosaic_output:
  jpeg_enabled: false
  rtsp_enabled: false
  rtsp_port: 8554
  rtsp_path: "mosaic"
  mosaic_webrtc_enabled: false
  video_bitrate_kbps: 4000
  encoder: "nvh264enc"
