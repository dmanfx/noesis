version: 1
batch_size: 3
streammux:
  width: 1920
  height: 1080
  batch-size: 3
  live-source: 1
  batched-push-timeout: 40000
  enable-padding: 0
  num-surfaces-per-frame: 1
  nvbuf-memory-type: 0
  sync-inputs: 0
  gpu-id: 0
sources:
- element: nvurisrcbin
  #living room camera
  uri_secret: living-room
  # uri: file:///path/to/living-room.mp4
  gpu-id: 0
  cudadec-memtype: 0
  latency: 10
  select-rtp-protocol: 4
  disable-audio: true
  dewarper:
    enable: true
    config-file: config/dewarper_g3_instant_charuco_1080.txt
- element: nvurisrcbin
  #kitchen camera
  uri_secret: kitchen
  # uri: file:///path/to/kitchen.mp4
  gpu-id: 0
  cudadec-memtype: 0
  latency: 10
  select-rtp-protocol: 4
  disable-audio: true
  dewarper:
    enable: true
    config-file: config/dewarper_g3_instant_charuco_1080.txt
- element: nvurisrcbin
  #family room camera
  uri_secret: family-room
  # uri: file:///path/to/family-room.mp4
  gpu-id: 0
  cudadec-memtype: 0
  latency: 10
  select-rtp-protocol: 4
  disable-audio: true
  dewarper:
    enable: true
    config-file: config/dewarper_g4_instant_charuco_720_to_1080.txt
preprocess:
  enable: true
  config-file: pipelines/config_preproc.ini
models:
  pgie:
    config-file-path: pipelines/config_infer_primary_yolo11_seg.ini
    engine: models/engines/yolo11s-seg_cust_fused.engine
    batch_size: 3
    gie_id: 1
    network_mode: fp16
    attach_tensor_meta: false
  reid:
    enable: true
    name: reid_sgie
    config-file-path: pipelines/config_infer_secondary_reid_swin.ini
    engine: models/engines/reid_swin_tiny_aicity156_dyn_b16_fp16.engine
    batch_size: 16
    gie_id: 3
    layer: fc_pred
    embedding_dim: 256
    attach_tensor_meta: true
  mapanything:
    enable: true
    name: mapanything_fullframe
    config-file-path: pipelines/config_infer_secondary_mapanything.ini
    engine: models/mapanything_depth/1/model.plan
    batch_size: 3
    gie_id: 2
    attach_tensor_meta: true
tracker:
  config-file: config/v3dt/nvtracker_v3dt_baseline.yml
  ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  tracker-width: 1920
  tracker-height: 1080
analytics:
  enable: true
  config-file: config/config_nvdsanalytics_post.ini
  stages_config: config/nvdsanalytics.yaml
  exclude:
    enable: true
    element: nvdsroiexclude
    config-file: config/analytics_exclude_baseline.ini
sinks:
- name: mosaic_sink
  type: fakesink
  sync: false
- name: bev_sink
  type: fakesink
  sync: false
mosaic_output:
  rtsp_enabled: false
  rtsp_port: 8554
  rtsp_path: mosaic
  mosaic_webrtc_enabled: true
  mosaic_h264_shm_socket: /tmp/noesis-mosaic-h264
  video_bitrate_kbps: 12000
  encoder: nvv4l2h264enc
  h264_iframeinterval: 10
  h264_idrinterval: 10
  h264_preset_id: 4
  h264_profile: 0
bev:
  frame: camera_local_ground_m
  jpeg_enabled: false
  jpeg_quality: 70
  smoothing:
    enabled: true
    max_speed_mps: 4.0
    max_jump_m: 0.75
    alpha: 0.45
    beta: 0.1
    ttl_s: 2.5
    reset_after_s: 1.25
visualization:
  instance_masks:
    alpha: 0.35
  trails:
    enabled: true
    class_ids:
    - 0
    window_s: 8.0
    draw_stride: 2
    min_step_px: 2.0
    min_dt_s: 0.08
    smooth_tau_s: 0.25
    max_speed_px_per_s: 600.0
    max_points_per_track: 257
    max_segments_per_track: 64
    max_tracks: 8
    max_lines: 800
    max_display_metas: 32
    line_width: 3
    min_alpha: 0.15
    show_labels: false
    color_key: stable_id
  osd_labels:
    font_size: 9
    font_name: Serif
    decimals: 2
v3dt:
  world_frame: backend_world_m
  caminfo_world_axes: xzy
