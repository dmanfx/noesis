# DeepStream 8 canonical configuration for the DS8 pipeline.
# Uses a multi-URI ingest path with NvDCF tracker and analytics ROI stages
# on Service Maker Pipeline APIs.

version: 1

# Required baseline room-registration artifact for DAv2->MapAnything-aligned world tracking.
depth_registration:
  path: config/depth_registration.json

# Process all three sources per batch.
batch_size: 3

streammux:
  width: 1920
  height: 1080
  batch-size: 3
  live-source: 1
  batched-push-timeout: 40000
  enable-padding: 0
  nvbuf-memory-type: 0  # Canonical NVMM setting used across streammux/dewarper/mosaic encode conversion.
  sync-inputs: 0
  gpu-id: 0

sources:
  - element: nvurisrcbin
    uri_secret: living-room
    # uri: file:///path/to/living-room.mp4
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: config/dewarper_g3_instant_charuco_1080.txt
  - element: nvurisrcbin
    #kitchen camera
    uri_secret: kitchen
    # uri: file:///path/to/kitchen.mp4
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: config/dewarper_g3_instant_charuco_1080.txt
  - element: nvurisrcbin
    #family room camera
    uri_secret: family-room
    # uri: file:///path/to/family-room.mp4
    gpu-id: 0
    cudadec-memtype: 0
    latency: 100
    select-rtp-protocol: 4
    disable-audio: true
    dewarper:
      enable: true
      config-file: config/dewarper_g4_instant_charuco_720_to_1080.txt


preprocess:
  enable: true
  config-file: pipelines/config_preproc.ini

models:
  pgie:
    config-file-path: pipelines/config_infer_primary_yolo11_seg.ini
    engine: models/engines/yolo11s-seg_cust_fused.engine
    batch_size: 3
    gie_id: 1
    network_mode: fp16
    attach_tensor_meta: false
  reid:
    enable: false
    name: reid_osnet
    config-file-path: pipelines/config_infer_secondary_reid_osnet.ini
    engine: models/engines/reid_osnet_ibn_msmt17_dyn_b16_fp16.engine
    batch_size: 16
    gie_id: 3
    layer: features
    embedding_dim: 512
    attach_tensor_meta: true
  pose:
    enable: false
    name: yolo26_pose
    config-file-path: pipelines/config_infer_secondary_yolo26_pose.ini
    engine: models/engines/yolo26n-pose_b16_fp16.engine
    batch_size: 16
    gie_id: 4
    attach_tensor_meta: true
    model_size: [640, 640]
    score_threshold: 0.25
    kpt_threshold: 0.35
    letterbox: true
  depth_tracking:
    enable: false
    name: depth_tracking_fullframe
    config-file-path: pipelines/config_infer_secondary_depth_tracking_da2.ini
    engine: models/engines/depth_anything_v2_metric_hypersim_vits_294x518_b3_fp16.engine
    batch_size: 3
    gie_id: 5
    attach_tensor_meta: true
  mapanything:
    enable: false
    name: mapanything_fullframe
    config-file-path: pipelines/config_infer_secondary_mapanything.ini
    engine: models/mapanything_depth/1/model.plan
    batch_size: 3
    gie_id: 2
    attach_tensor_meta: true

tracker:
  config-file: config/v3dt/reimpl/nvtracker_sv3dt_yolo26s_posefast.yml
  ll-lib-file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so

analytics:
  enable: true
  config-file: config/config_nvdsanalytics_post.ini
  stages_config: config/nvdsanalytics.yaml
  exclude:
    enable: true
    element: nvdsroiexclude
    config-file: config/config_nvdsanalytics_exclude.ini

sinks:
  - name: mosaic_sink
    type: fakesink  # Semantic placeholder only; mosaic video uses encoded-AU SHM→WebRTC.
    sync: false
  - name: bev_sink
    type: fakesink
    sync: false  # Placeholder for future BEV retrieval; current BEV path uses telemetry hooks, not Flow/appsinks.

# Legacy frame output stanza (not used in tiled DS8 mode; mosaic video is encoded-AU SHM→WebRTC).
output:
  enable_frames: false  # No per-camera JPEG-over-WS frame output in DS8 tiled mode.
  codec: jpeg
  jpeg_quality: 85
  overlays: false

# Mosaic output configuration: canonical SHM/WebRTC plus optional RTSP tooling
mosaic_output:
  rtsp_enabled: false        # Optional tooling only; WebRTC consumes H.264 AUs through SHM
  rtsp_port: 8554            # RTSP server port (unused when rtsp_enabled is false)
  rtsp_path: "mosaic"        # RTSP stream path (url: rtsp://host:port/path)
  mosaic_webrtc_enabled: true
  mosaic_h264_shm_socket: "/tmp/noesis-mosaic-h264"
  video_bitrate_kbps: 12000  # Quality floor for the 3840x720 short-GOP mosaic
  encoder: "nvv4l2h264enc"   # Required GPU encoder; no CPU fallback
  # IDR every 10 input frames for bounded decoder recovery.
  h264_iframeinterval: 10
  h264_idrinterval: 10
  h264_preset_id: 4
  h264_profile: 0            # 0=baseline, 1=main, 2=high (H.264)

bev:
  # The inline BEV panels overlay tracks on camera-local MapAnything floorplans.
  # Keep backend-world tracking in tracking telemetry; publish BEV display points
  # in the same camera-local ground frame as the floorplan raster.
  frame: camera_local_ground_m
  jpeg_enabled: false
  jpeg_quality: 70
  smoothing:
    # Producer owns BEV world-path stabilization so FE consumes one already-physical track path.
    enabled: true
    max_speed_mps: 4.0    # Physical gate (meters/sec): cap per-frame travel by speed * dt
    max_jump_m: 0.75      # Extra slack for homography jitter (meters)
    alpha: 0.45           # Alpha-beta filter position gain (0..1)
    beta: 0.10            # Alpha-beta filter velocity gain (0..1)
    ttl_s: 2.5            # Forget track state after not seen for this long
    reset_after_s: 1.25   # If dt exceeds this, accept measurement and reset filter

visualization: # Visualization overlays rendered into the mosaic stream (tiler → osd).
  display_keypoints: false # Render pose keypoints/skeletons from the pose SGIE.
  instance_masks:
    alpha: 0.35 # Mask overlay opacity (stable-id keyed color; matches BEV + Active Tracks hue math).
  trails:
    enabled: true # Enable trails overlay.
    anchor_mode: floor_plane_gravity_drop # Floor-lock trails while tracked; no predicted-gap trail segments.
    class_ids: [0] # Restrict trails to people only (class_id 0).
    window_s: 8.0 # Time-window trail history (seconds).
    draw_stride: 1 # Motion-following: sample each update for tighter trail lock.
    min_step_px: 1.0 # Motion-following: lower decimation threshold.
    min_dt_s: 0.08 # Decimate: or enough time elapsed (seconds).
    smooth_tau_s: 0.18 # Motion-following: reduce filter lag while still damping jitter.
    gap_predict_ttl_s: 0.0 # Disabled: do not synthesize predicted trail motion across track dropouts.
    gap_predict_decay_tau_s: 0.75 # Unused while gap prediction is disabled.
    predicted_alpha_scale: 0.65 # Unused while gap prediction is disabled.
    height_peak_up_alpha: 0.35 # Learn full-body pixel height quickly when unobscured.
    height_peak_down_alpha: 0.05 # Decay pixel-height reference slowly under lower-body occlusion.
    height_good_frame_ratio: 0.90 # Only refresh scene-height model when box height is near the recent full-body peak.
    # Frontend BEV-only trail tuning (ignored by backend stream overlay hook).
    head_smooth_tau_s: 0.06 # Faster head-dot response target (~300 ms class) with light damping.
    trail_smooth_tau_s: 0.19 # Keep tail smoother than head for readable path history.
    min_step_scene_floor: 0.0 # Allow near-zero movement segments when needed (prevents trail starvation).
    min_step_scene_ceil: 0.11 # Cap scene-step decimation to keep trails visible across room scales.
    stale_head_blink_enabled: false # Stream overlay parity: no stale head blinking by default.
    max_speed_px_per_s: 1200.0 # Motion-following: relax speed clamp to avoid trail lag/drift.
    max_points_per_track: 257 # Bound trails by BOTH time and points.
    max_segments_per_track: 64 # Max segments rendered per track per frame.
    max_tracks: 8 # Max tracks rendered per frame (across the mosaic).
    max_lines: 800 # Rendering budget (hard cap).
    max_display_metas: 32 # DisplayMeta blocks for long trails.
    line_width: 3 # Trail line width (pixels).
    min_alpha: 0.15 # Minimum alpha for trail fade.
    show_labels: false # Show ID labels along trails.
    color_key: stable_id # Use StableIDManager stable_id when available.
  osd_labels:
    font_size: 9 # Label font size for nvdsosd text overlay.
    font_name: Serif # Font family (must match ds_osd.FontFamily).
    decimals: 2 # Confidence decimals.

v3dt:
  tracking_mode: v3dt
  world_frame: backend_world_m
  caminfo_world_axes: xzy
