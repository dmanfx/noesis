[service]
host=127.0.0.1
port=8003
api_key=noesis_secret

[inference]
model_id=facebook/map-anything-apache
device=cuda:0
amp_dtype=bf16
memory_efficient_mono=false
memory_efficient_multi=true
apply_mask=true
mask_edges=true
confidence_percentile=10

[performance]
max_res=512
mono_freq=5  # Hz
multi_batch_size=1
multi_interval=60  # s
min_conf=0.5

[storage]
depth_base=data/depth
calib_base=data/calib
max_snapshots_per_camera=20
snapshot_retention_minutes=10
max_total_bytes=5GB
queue_size=128
intrinsics_table_path=models/mapanything_depth/intrinsics_table.txt
intrinsics_conf_threshold=0.7
intrinsics_min_snapshots=3
intrinsics_auto_disable=true
