[service]
host=127.0.0.1
port=8001
api_key_file=~/.local/state/noesis/secrets/mapanything_rpc.key

[inference]
model_id=facebook/map-anything-apache
device=cuda:0
amp_dtype=bf16
memory_efficient_mono=false
memory_efficient_multi=true
apply_mask=true
mask_edges=true
confidence_percentile=10

[performance]
max_res=960
mono_freq=2  # Hz
multi_batch_size=6
multi_interval=60  # s
min_conf=0.1

[storage]
depth_base=data/depth
calib_base=data/calib
max_snapshots_per_camera=128
snapshot_retention_minutes=10
max_total_bytes=5GB
queue_size=128
zarr_chunk_px=0
