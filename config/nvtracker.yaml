# Noesis DeepStream 8 NvDCF tracker configuration (DS8 canonical schema)
#
# Accuracy-oriented NvDCF profile derived from the DS8 sample
# config_tracker_NvDCF_accuracy.yml, tuned for 3 indoor person cameras:
# - Cascaded data association (associationMatcherType: 1)
# - ReID-based target re-association across occlusions (enableReAssoc + reidType 2)
# - Long shadow tracking (maxShadowTrackingAge: 300 frames ~ 10s) so occluded
#   people keep their track_id instead of being terminated and re-created.

BaseConfig:
  minDetectorConfidence: 0.1894

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 60
  minIouDiff4NewTarget: 0.3686
  minTrackerConfidence: 0.1513
  probationAge: 2
  # Keep occluded targets alive in shadow mode long enough for people to pass
  # behind furniture/doorways and re-appear (~10 s at 30 fps).
  maxShadowTrackingAge: 300
  earlyTerminationAge: 2

TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 1

  # [Re-Assoc Metric: Thresholds for valid candidates]
  minMatchingScore4Overall: 0.6622
  minTrackletMatchingScore: 0.2940
  minMatchingScore4ReidSimilarity: 0.0771

  # [Re-Assoc Metric: Weights]
  matchingScoreWeight4TrackletSimilarity: 0.7981
  matchingScoreWeight4ReidSimilarity: 0.3848

  # [Re-Assoc: Motion-based]
  minTrajectoryLength4Projection: 34
  prepLength4TrajectoryProjection: 58
  trajectoryProjectionLength: 33
  maxAngle4TrackletMatching: 67
  minSpeedSimilarity4TrackletMatching: 0.0574
  minBboxSizeSimilarity4TrackletMatching: 0.1013
  maxTrackletMatchingTimeSearchRange: 27
  trajectoryProjectionProcessNoiseScale: 0.0100
  trajectoryProjectionMeasurementNoiseScale: 100
  trackletSpacialSearchRegionScale: 0.0100

  # [Re-Assoc: Reid based. Reid model params are set in ReID section]
  # 16-frame extraction cadence halves tracker-ReID GPU load; re-assoc only
  # needs a periodic appearance history, not per-frame features.
  reidExtractionInterval: 16

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1    # CASCADED matching (GREEDY=0, CASCADED=1)
  checkClassMatch: 1

  # [Association Metric: Thresholds for valid candidates]
  minMatchingScore4Overall: 0.0222
  minMatchingScore4SizeSimilarity: 0.3552
  minMatchingScore4Iou: 0.0548
  minMatchingScore4VisualSimilarity: 0.5043

  # [Association Metric: Weights]
  matchingScoreWeight4VisualSimilarity: 0.3951
  matchingScoreWeight4SizeSimilarity: 0.6003
  matchingScoreWeight4Iou: 0.4033

  # [Association Metric: Tentative detections]
  tentativeDetectorConfidence: 0.1024
  minMatchingScore4TentativeIou: 0.2852

StateEstimator:
  stateEstimatorType: 1
  processNoiseVar4Loc: 6810.8668
  processNoiseVar4Size: 1541.8647
  processNoiseVar4Vel: 1348.4874
  measurementNoiseVar4Detector: 100.0000
  measurementNoiseVar4Tracker: 293.3238

VisualTracker:
  visualTrackerType: 2    # NvDCF_VPI
  useColorNames: 1
  # HOG disabled: ColorNames alone keeps DCF quality for indoor person scale
  # at roughly half the per-target feature cost (ReID re-assoc covers identity).
  useHog: 0
  featureImgSizeLevel: 3
  featureFocusOffsetFactor_y: -0.1054
  filterLr: 0.0767
  filterChannelWeightsLr: 0.0339
  gaussianSigma: 0.5687

ReID:
  # Reid-based re-association only (DUMMY=0, NvDEEPSORT=1, re-assoc=2, both=3).
  # This model runs inside nvtracker for per-camera re-association across
  # occlusions; cross-camera identity uses the Swin ReID SGIE + StableIDManager.
  reidType: 2
  batchSize: 32
  workspaceSize: 1000
  reidFeatureSize: 256
  reidHistorySize: 100
  inferDims: [3, 256, 128]
  networkMode: 1    # fp16

  # [Input Preprocessing]
  inputOrder: 0
  colorFormat: 0
  offsets: [123.6750, 116.2800, 103.5300]
  netScaleFactor: 0.01735207
  keepAspc: 1
  useVPICropScaler: 1

  # [Output Postprocessing]
  addFeatureNormalization: 1
  minVisibility4GalleryUpdate: 0.6

  # [Paths and Names]
  tltEncodedModel: models/tracker_reid/resnet50_market1501.etlt
  tltModelKey: nvidia_tao
  modelEngineFile: models/tracker_reid/resnet50_market1501.etlt_b32_gpu0_fp16.engine

ShadowTracker:
  targetVisibilityThreshold: 0.15
  minDetectorConfidence: 0.1
  minTargetBboxSize: 10

Misc:
  locUncertaintyThreshold: 50.0
