# Noesis DeepStream 8 NvDCF tracker configuration (DS8 canonical schema)

BaseConfig:
  minDetectorConfidence: 0.2

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 150
  minIouDiff4NewTarget: 0.55
  minTrackerConfidence: 0.2
  probationAge: 2
  maxShadowTrackingAge: 300
  earlyTerminationAge: 10

TrajectoryManagement:
  useUniqueID: 0

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 0
  checkClassMatch: 1
  minMatchingScore4Overall: 0.2
  minMatchingScore4SizeSimilarity: 0.35
  minMatchingScore4Iou: 0.2
  minMatchingScore4VisualSimilarity: 0.5
  matchingScoreWeight4VisualSimilarity: 0.33
  matchingScoreWeight4SizeSimilarity: 0.42
  matchingScoreWeight4Iou: 0.35
  tentativeDetectorConfidence: 0.2
  minMatchingScore4TentativeIou: 0.5

StateEstimator:
  stateEstimatorType: 3
  processNoiseVar4Loc: 0.68108668
  processNoiseVar4Vel: 0.13484874
  measurementNoiseVar4Detector: 0.01
  measurementNoiseVar4Tracker: 0.02933238

ObjectModelProjection:
  outputFootLocation: 1
  outputVisibility: 1
  outputConvexHull: 0
  cameraModelFilepath:
  - config/v3dt/reimpl/caminfo/camInfo_living-room.yml
  - config/v3dt/reimpl/caminfo/camInfo_kitchen.yml
  - config/v3dt/reimpl/caminfo/camInfo_family-room.yml
  objectModelType: 0

VisualTracker:
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 3
  featureFocusOffsetFactor_y: -0.1
  filterLr: 0.075
  filterChannelWeightsLr: 0.015
  gaussianSigma: 0.75

AppearanceModel:
  useReidFeature: 1
  reidFeatureSize: 128
  reidHistorySize: 400

ShadowTracker:
  targetVisibilityThreshold: 0.15
  minDetectorConfidence: 0.2
  minTargetBboxSize: 10

Misc:
  locUncertaintyThreshold: 50.0
