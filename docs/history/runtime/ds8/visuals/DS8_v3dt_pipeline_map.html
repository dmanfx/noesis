<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DS8 SV3DT Frame Flow Map</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #171a21;
        --text: #e9eef7;
        --muted: #b5c0d1;
        --blue: #3b82f6;
        --green: #22c55e;
        --orange: #f59e0b;
        --gray: #94a3b8;
        --red: #ef4444;
      }
      html, body {
        background: var(--bg);
        color: var(--text);
        margin: 0;
        padding: 0;
        font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
      }
      .wrap {
        padding: 16px;
      }
      .title {
        font-size: 20px;
        margin: 0 0 8px 0;
        color: var(--text);
      }
      .subtitle {
        margin: 0 0 12px 0;
        color: var(--muted);
        font-size: 12px;
      }
      svg {
        width: 100%;
        height: auto;
        background: var(--panel);
        border-radius: 12px;
      }
      .box {
        fill: #111827;
        stroke: #2b3442;
        stroke-width: 2;
      }
      .box-blue { stroke: var(--blue); }
      .box-green { stroke: var(--green); }
      .box-orange { stroke: var(--orange); }
      .box-gray { stroke: var(--gray); }
      .box-red { stroke: var(--red); }
      .label {
        fill: var(--text);
        font-size: 14px;
        font-weight: 600;
      }
      .small {
        fill: var(--muted);
        font-size: 12px;
        font-weight: 400;
      }
      .legend {
        fill: var(--muted);
        font-size: 12px;
      }
      .arrow {
        stroke: #9fb0c7;
        stroke-width: 2.5;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .arrow-thin {
        stroke: #6b7b93;
        stroke-width: 2;
        fill: none;
        marker-end: url(#arrowhead);
      }
      .arrow-label {
        fill: #c8d4e6;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title">DS8 SV3DT Frame Flow Map (Family-Room Focus)</h1>
      <p class="subtitle">Resolution + warp/scale + consumers + file references. Source is 1280×720, streammux scales to 1920×1080 unless noted.</p>
      <svg viewBox="0 0 2600 1500" role="img" aria-label="DS8 SV3DT frame flow map">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
            <polygon points="0,0 10,4 0,8" fill="#9fb0c7"></polygon>
          </marker>
        </defs>

        <!-- Title band -->
        <rect class="box box-gray" x="20" y="20" width="2560" height="60" rx="10"></rect>
        <text class="label" x="40" y="56">Runtime Pipeline (GPU): decode → dewarp → streammux → detect → depth → SV3DT → mosaic</text>

        <!-- Row: Living-room / Kitchen path -->
        <rect class="box box-blue" x="60" y="140" width="240" height="70" rx="8"></rect>
        <text class="label" x="76" y="168">Source (RTSP/file)</text>
        <text class="small" x="76" y="188">1280×720</text>

        <rect class="box box-green" x="330" y="140" width="240" height="70" rx="8"></rect>
        <text class="label" x="346" y="168">nvurisrcbin</text>
        <text class="small" x="346" y="188">decode → NV12</text>

        <!-- Row: Family-room path with dewarper -->
        <rect class="box box-blue" x="60" y="260" width="240" height="70" rx="8"></rect>
        <text class="label" x="76" y="288">Family-room src</text>
        <text class="small" x="76" y="308">1280×720</text>

        <rect class="box box-green" x="330" y="260" width="240" height="70" rx="8"></rect>
        <text class="label" x="346" y="288">nvurisrcbin</text>
        <text class="small" x="346" y="308">decode → NV12</text>

        <rect class="box box-green" x="600" y="260" width="240" height="70" rx="8"></rect>
        <text class="label" x="616" y="288">nvvideoconvert</text>
        <text class="small" x="616" y="308">NV12 → RGBA</text>

        <rect class="box box-green" x="870" y="260" width="260" height="90" rx="8"></rect>
        <text class="label" x="886" y="290">nvdewarper</text>
        <text class="small" x="886" y="310">config/dewarper_family_room_charuco_rtsp.txt</text>
        <text class="small" x="886" y="330">distortion + K (GPU)</text>

        <rect class="box box-green" x="1160" y="260" width="240" height="70" rx="8"></rect>
        <text class="label" x="1176" y="288">nvvideoconvert</text>
        <text class="small" x="1176" y="308">RGBA → NV12</text>

        <!-- Streammux -->
        <rect class="box box-green" x="1440" y="190" width="260" height="90" rx="10"></rect>
        <text class="label" x="1456" y="220">nvstreammux</text>
        <text class="small" x="1456" y="242">1920×1080 (scale)</text>
        <text class="small" x="1456" y="262">all streams here</text>

        <!-- Downstream main chain -->
        <rect class="box box-green" x="1730" y="190" width="220" height="70" rx="8"></rect>
        <text class="label" x="1746" y="218">preprocess</text>
        <text class="small" x="1746" y="238">pipelines/config_preproc.ini</text>

        <rect class="box box-green" x="1980" y="190" width="220" height="70" rx="8"></rect>
        <text class="label" x="1996" y="218">PGIE YOLO</text>
        <text class="small" x="1996" y="238">config_infer_primary_yolo11_seg.ini</text>

        <rect class="box box-green" x="2230" y="190" width="180" height="70" rx="8"></rect>
        <text class="label" x="2246" y="218">main_tee</text>
        <text class="small" x="2246" y="238">branch point</text>

        <rect class="box box-green" x="2440" y="190" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="218">SV3DT tracker</text>
        <text class="small" x="2456" y="238">config/v3dt/nvtracker_sv3dt_*.yml</text>

        <!-- Tracker downstream column -->
        <rect class="box box-green" x="2440" y="310" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="338">nvdsanalytics</text>
        <text class="small" x="2456" y="358">config/nvdsanalytics.yaml</text>

        <rect class="box box-green" x="2440" y="430" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="458">ReID</text>
        <text class="small" x="2456" y="478">config_infer_secondary_reid_osnet.ini</text>

        <rect class="box box-green" x="2440" y="550" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="578">tiler</text>
        <text class="small" x="2456" y="598">mosaic layout</text>

        <rect class="box box-green" x="2440" y="670" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="698">OSD</text>
        <text class="small" x="2456" y="718">nvdsosd</text>

        <rect class="box box-green" x="2440" y="790" width="220" height="70" rx="8"></rect>
        <text class="label" x="2456" y="818">RTSP Mosaic</text>
        <text class="small" x="2456" y="838">rtsp://localhost:8554/mosaic</text>

        <!-- MapAnything branch -->
        <rect class="box box-green" x="2230" y="320" width="180" height="60" rx="8"></rect>
        <text class="label" x="2246" y="348">mapanything</text>
        <text class="small" x="2246" y="368">depth SGIE</text>

        <rect class="box box-gray" x="2230" y="400" width="180" height="60" rx="8"></rect>
        <text class="label" x="2246" y="428">depth cache</text>
        <text class="small" x="2246" y="448">used by auto-tilt</text>

        <!-- Diagnostics -->
        <rect class="box box-gray" x="2440" y="900" width="220" height="90" rx="8"></rect>
        <text class="label" x="2456" y="930">Diagnostics</text>
        <text class="small" x="2456" y="950">diagnostics/v3dt_frames_*.ndjson</text>
        <text class="small" x="2456" y="970">v3dt_report_*.md / panel_*.html</text>

        <!-- Offline calibration block -->
        <rect class="box box-orange" x="60" y="420" width="520" height="300" rx="12"></rect>
        <text class="label" x="80" y="452">Offline Calibration (OpenCV)</text>
        <text class="small" x="80" y="475">/tmp/charuco_fr/frame_*.jpg → scripts/charuco_calibrate_intrinsics.py</text>
        <text class="small" x="80" y="495">diagnostics/charuco_family_room_rtsp_1280x720.json</text>
        <text class="small" x="80" y="515">config/cameras_preview_charuco_fr_rtsp.yaml</text>
        <text class="small" x="80" y="535">config/cameras_preview_charuco_fr_rtsp_dewarp.yaml (rectified)</text>
        <text class="small" x="80" y="555">config/dewarper_family_room_charuco_rtsp.txt</text>
        <text class="small" x="80" y="575">scripts/auto_tilt_from_depth.py</text>
        <text class="small" x="80" y="595">config/camera_calibration_preview_dewarp_fullfov_tilt.json</text>
        <text class="small" x="80" y="615">scripts/generate_v3dt_caminfo.py (scales to streammux)</text>
        <text class="small" x="80" y="635">config/v3dt_preview_charuco_fr_rtsp_dewarp/camInfo_family-room.yml</text>
        <text class="small" x="80" y="655">OpenCV is only here; runtime uses nvdewarper (GPU)</text>

        <!-- CamInfo and scaling callout -->
        <rect class="box box-gray" x="620" y="420" width="520" height="130" rx="12"></rect>
        <text class="label" x="640" y="450">CamInfo Scaling Rule</text>
        <text class="small" x="640" y="472">camInfo must match streammux resolution</text>
        <text class="small" x="640" y="492">example: 1280×720 source → streammux 1920×1080</text>
        <text class="small" x="640" y="512">generate_v3dt_caminfo.py scales K using pipeline config</text>
        <text class="small" x="640" y="532">file: config/infer_v3dt_medium_preview_charuco_fr_rtsp_dewarp.yaml</text>

        <!-- 720 vs 1080 callout -->
        <rect class="box box-red" x="620" y="570" width="520" height="130" rx="12"></rect>
        <text class="label" x="640" y="600">Resolution Truths</text>
        <text class="small" x="640" y="622">1280×720 = source + dewarper output</text>
        <text class="small" x="640" y="642">1920×1080 = streammux output (PGIE/MapAnything/Tracker)</text>
        <text class="small" x="640" y="662">Tiler output defaults to streammux size (unless overridden)</text>

        <!-- Arrows: living/kitchen -->
        <line class="arrow" x1="300" y1="175" x2="330" y2="175"></line>
        <line class="arrow" x1="570" y1="175" x2="1440" y2="225"></line>

        <!-- Arrows: family-room chain -->
        <line class="arrow" x1="300" y1="295" x2="330" y2="295"></line>
        <line class="arrow" x1="570" y1="295" x2="600" y2="295"></line>
        <line class="arrow" x1="840" y1="295" x2="870" y2="295"></line>
        <line class="arrow" x1="1130" y1="295" x2="1160" y2="295"></line>
        <line class="arrow" x1="1400" y1="295" x2="1440" y2="245"></line>

        <!-- Arrows: streammux to main -->
        <line class="arrow" x1="1700" y1="235" x2="1730" y2="235"></line>
        <line class="arrow" x1="1950" y1="235" x2="1980" y2="235"></line>
        <line class="arrow" x1="2200" y1="235" x2="2230" y2="235"></line>
        <line class="arrow" x1="2410" y1="235" x2="2440" y2="235"></line>

        <!-- Arrows: tracker column -->
        <line class="arrow" x1="2550" y1="260" x2="2550" y2="310"></line>
        <line class="arrow" x1="2550" y1="380" x2="2550" y2="430"></line>
        <line class="arrow" x1="2550" y1="500" x2="2550" y2="550"></line>
        <line class="arrow" x1="2550" y1="620" x2="2550" y2="670"></line>
        <line class="arrow" x1="2550" y1="740" x2="2550" y2="790"></line>
        <line class="arrow-thin" x1="2550" y1="860" x2="2550" y2="900"></line>

        <!-- Arrows: mapanything branch -->
        <line class="arrow" x1="2320" y1="260" x2="2320" y2="320"></line>
        <line class="arrow" x1="2320" y1="380" x2="2320" y2="400"></line>

        <!-- Arrows: depth → auto-tilt (offline block) -->
        <line class="arrow-thin" x1="2230" y1="430" x2="580" y2="520"></line>
        <text class="arrow-label" x="1450" y="470">auto_tilt uses MapAnything depth</text>

        <!-- Arrows: offline → dewarper/camInfo -->
        <line class="arrow-thin" x1="580" y1="620" x2="870" y2="300"></line>
        <text class="arrow-label" x="660" y="330">dewarper params</text>

        <line class="arrow-thin" x1="580" y1="640" x2="2440" y2="220"></line>
        <text class="arrow-label" x="900" y="240">camInfo feeds tracker</text>

        <!-- Legend -->
        <rect class="box box-gray" x="60" y="740" width="520" height="120" rx="12"></rect>
        <text class="label" x="80" y="770">Legend</text>
        <text class="legend" x="80" y="792">Blue: sources / resolution roots</text>
        <text class="legend" x="80" y="812">Green: runtime GPU pipeline (DS8)</text>
        <text class="legend" x="80" y="832">Orange: offline OpenCV calibration</text>
        <text class="legend" x="80" y="852">Gray: diagnostics / notes</text>
      </svg>
    </div>
  </body>
</html>
