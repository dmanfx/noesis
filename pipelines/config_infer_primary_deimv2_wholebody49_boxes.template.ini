[property]
# DEIMv2 Wholebody49 label-only PGIE.
# Used for promoted larger Wholebody49 variants that have a validated boxes
# engine but no materialized instance-mask engine.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=0
gie-unique-id=1
process-mode=1
network-type=0
network-mode=2
input-tensor-from-meta=1
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

cluster-mode=4
num-detected-classes=49
operate-on-class-ids=0

parse-bbox-func-name=NvDsInferParseDeimv2Wholebody49Boxes
custom-lib-path=@CUSTOM_LIB@
output-blob-names=label_xyxy_score
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.99
topk=300
nms-iou-threshold=0.45

[class-attrs-0]
pre-cluster-threshold=0.50
