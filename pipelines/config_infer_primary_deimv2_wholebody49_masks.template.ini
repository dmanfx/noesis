[property]
# DEIMv2 Wholebody49 instance-mask PGIE.
# The ONNX wrapper bakes ImageNet mean/std into the graph. The paired
# nvdspreprocess config feeds RGB float tensors scaled to 0..1.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=0
gie-unique-id=1
process-mode=1
network-type=3
network-mode=2
input-tensor-from-meta=1
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

cluster-mode=4
num-detected-classes=49
operate-on-class-ids=0

parse-bbox-instance-mask-func-name=NvDsInferParseDeimv2Wholebody49
custom-lib-path=@CUSTOM_LIB@
output-instance-mask=1
output-blob-names=label_xyxy_score;masks
segmentation-threshold=0.50
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.99
topk=300
nms-iou-threshold=0.45

[class-attrs-0]
pre-cluster-threshold=0.50
