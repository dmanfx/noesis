[property]
# RF-DETR primary detector (size selected at runtime via --size n|s|m)
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=/home/mayor/Noesis_Devel/models/coco_labels.txt

# Execution
gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=0
# 0=FP32, 1=INT8, 2=FP16
network-mode=2
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=1
symmetric-padding=1

# Keep host-copy enabled by default; the parser copies compact det/logit slices only.
disable-output-host-copy=0

# RF-DETR is end-to-end. No NMS inside DeepStream.
cluster-mode=4

# The parser maps RF-DETR COCO person index 1 to DeepStream classId 0.
num-detected-classes=80
operate-on-class-ids=0

parse-bbox-func-name=NvDsInferParseRFDETR
custom-lib-path=/home/mayor/Noesis_Devel/pipelines/nvdsinfer_rfdetr/libnvdsinfer_rfdetr.so
output-blob-names=dets;labels

output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.99
topk=@TOPK@
nms-iou-threshold=0.45

[class-attrs-0]
# RF-DETR scores for COCO person can be lower than YOLO; keep this permissive and rely on tracker gating.
pre-cluster-threshold=0.4
