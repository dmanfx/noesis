[property]
# RF-DETR instance segmentation primary detector (size selected at runtime via --size n|s|m)
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=/home/mayor/Noesis_Devel/models/coco_labels.txt

# Execution
gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=3
# 0=FP32, 1=INT8, 2=FP16
network-mode=2
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=1
symmetric-padding=1

# Keep host-copy enabled for RF-DETR seg by default; device-copy path currently
# regresses end-to-end utilization for this export.
disable-output-host-copy=0

# RF-DETR is end-to-end (no NMS); instance segmentation requires cluster-mode=4 (NONE).
cluster-mode=4

# Classes (DS still treats "person" as class_id 0)
# Note: RF-DETR COCO logits are indexed by COCO category id (person=1). The parser maps
# `NOESIS_RFDETR_PERSON_CLASS_IDX` (default 1) -> DS `classId=0` and filters people-only.
num-detected-classes=80
operate-on-class-ids=0

# Parser (reads output layers by name; requires output-blob-names include dets;labels;masks)
parse-bbox-instance-mask-func-name=NvDsInferParseRFDETRSeg
custom-lib-path=/home/mayor/Noesis_Devel/pipelines/nvdsinfer_rfdetr_seg/libnvdsinfer_rfdetr_seg.so
output-instance-mask=1
output-blob-names=dets;labels;masks

# Mask threshold used by nvdsosd when composing instance masks.
segmentation-threshold=0.50

# Optional debugging
output-tensor-meta=0

[class-attrs-all]
# Keep default threshold high to suppress non-person classes by default.
pre-cluster-threshold=0.99
# Limit parser/object-list fan-out (materialized per size by ds8_runtime.py).
topk=@TOPK@
nms-iou-threshold=0.45

[class-attrs-0]
# Person class (DS class 0 after parser remap).
# RF-DETR scores for COCO person can be lower than YOLO; keep this permissive and rely on tracker gating.
pre-cluster-threshold=0.4
