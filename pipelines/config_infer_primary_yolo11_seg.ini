[property]
# YOLO11 instance segmentation primary detector (fused output)
# Model + engine
onnx-file=models/yolo11m-seg_cust.onnx
model-engine-file=models/engines/yolo11m-seg_cust.engine
labelfile-path=models/coco_labels.txt

# Execution
gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=3
network-mode=1
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

# NMS handled in TensorRT (EfficientNMS). Keep cluster-mode=4 for masks.
cluster-mode=4

# Classes
num-detected-classes=80
operate-on-class-ids=0
#;17;25;57;58;61;63;70;72;73

# Parser (fused output)
parse-bbox-instance-mask-func-name=NvDsInferParseYoloSeg
custom-lib-path=pipelines/nvdsinfer_yolo11_seg/libnvdsinfer_yolo11_seg.so
output-instance-mask=1
output-blob-names=output0

# Mask threshold used when composing instance masks. Higher = tighter silhouettes.
segmentation-threshold=0.70

# Optional debugging
output-tensor-meta=0

[class-attrs-all]
# Raise default threshold high to suppress non-person classes by default.
pre-cluster-threshold=0.99
# The following are unused by fused-NMS, kept for completeness
topk=30
nms-iou-threshold=0.45

[class-attrs-0]
# Person class (COCO class 0). Keep reasonable threshold for detection.
pre-cluster-threshold=0.35
