[property]
# YOLO11 instance segmentation primary detector (smoke config)
# This is identical to `pipelines/config_infer_primary_yolo11_seg.ini` except
# for more permissive thresholds so DeepStream sample videos produce detections.
onnx-file=/home/mayor/Noesis_Devel/models/yolo11m-seg_cust.onnx
model-engine-file=/home/mayor/Noesis_Devel/models/engines/yolo11s-seg_cust_fused.engine
labelfile-path=/home/mayor/Noesis_Devel/models/coco_labels.txt

gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=3
network-mode=1
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=1
symmetric-padding=1

# NMS handled in TensorRT (EfficientNMS). Keep cluster-mode=4 for masks.
cluster-mode=4

num-detected-classes=80
operate-on-class-ids=0

parse-bbox-instance-mask-func-name=NvDsInferParseYoloSeg
custom-lib-path=/home/mayor/Noesis_Devel/pipelines/nvdsinfer_yolo11_seg/libnvdsinfer_yolo11_seg.so
output-instance-mask=1
output-blob-names=output0

segmentation-threshold=0.70
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.50
topk=300
nms-iou-threshold=0.45

[class-attrs-0]
pre-cluster-threshold=0.10
