[property]
# YOLO26 instance segmentation (fused output0 only)
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

# Execution
gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=3
network-mode=2
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

# Keep tensor outputs on the GPU (avoid large D2H copies). The custom parser will
# copy only the needed slices from device memory.
disable-output-host-copy=1

# End-to-end detections; no NMS inside DeepStream
cluster-mode=4

# Classes
num-detected-classes=80
operate-on-class-ids=0

# Parser
parse-bbox-instance-mask-func-name=NvDsInferParseYolo26Seg
custom-lib-path=@CUSTOM_LIB@
output-instance-mask=1
output-blob-names=output0

# Mask threshold used by nvdsosd when composing instance masks.
segmentation-threshold=0.50

# Optional debugging
output-tensor-meta=0

[class-attrs-all]
pre-cluster-threshold=0.99
topk=30
nms-iou-threshold=0.45

[class-attrs-0]
pre-cluster-threshold=0.35

