[property]
gpu-id=0
# Secondary inference operating on PGIE object crops
process-mode=2
gie-type=1
# Unique identifier for DA V2 SGIE. Must match DeepStreamVideoPipeline.depth_unique_id
gie-unique-id=2
operate-on-gie-id=1
operate-on-class-ids=0
batch-size=8

# TensorRT engine produced from Depth Anything V2 metric ViT-L model
# See scripts/prepare_depth_anything_v2_engine.py for conversion steps
model-engine-file=../models/engines/depth_anything_v2_metric_vitl_fp16.engine
labelfile-path=

# Network I/O formatting
network-type=2
model-color-format=0
infer-dims=3;518;518
maintain-aspect-ratio=0
net-scale-factor=0.0039215697906911373
offsets=123.675;116.28;103.53
input-object-min-width=16
input-object-min-height=16

# Output tensor configuration
output-blob-names=pred
output-tensor-meta=1
input-tensor-meta=0

# Optimization toggles
workspace-size=4096
force-implicit-batch-dim=1

[class-attrs-all]
pre-cluster-threshold=0.0
