[property]
# Reviewed DS8 source contract for the canonical DAv2 full-frame tracking lane.
# Production derives an engine-only copy under NOESIS_BUILD_DIR and never passes
# the ONNX build input below to nvinfer.
onnx-file=models/onnx/depth_anything_v2_metric_hypersim_vits_294x518_b3.onnx
model-engine-file=models/engines/depth_anything_v2_metric_hypersim_vits_294x518_b3_fp16.engine

gpu-id=0
batch-size=3
interval=1
gie-unique-id=5
process-mode=1
network-type=100
network-mode=2
model-color-format=0
# The export wrapper divides by 255 and applies channel normalization internally.
net-scale-factor=1.0
input-tensor-from-meta=0
infer-dims=3;294;518
maintain-aspect-ratio=0
symmetric-padding=0
output-tensor-meta=1
# Keep tensor outputs device-only; the baseline DAv2 path extracts from
# out_buf_ptrs_dev and aligns on-GPU before any object-level host reads occur.
disable-output-host-copy=1
