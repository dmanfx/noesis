[property]
# Depth Anything V2 metric depth tracking branch (full-frame image input)
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=@INTERVAL@
gie-unique-id=@GIE_ID@
process-mode=1
network-type=100
network-mode=2
model-color-format=0
# The export wrapper divides by 255 and applies channel normalization internally.
net-scale-factor=1.0
input-tensor-from-meta=0
infer-dims=3;@HEIGHT@;@WIDTH@
maintain-aspect-ratio=0
symmetric-padding=0
output-tensor-meta=1
# Keep tensor outputs device-only; the baseline DAv2 path now extracts from
# out_buf_ptrs_dev and aligns on-GPU before any object-level host reads occur.
disable-output-host-copy=1
