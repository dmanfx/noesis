[property]
gpu-id=0
batch-size=3
process-mode=1
network-mode=2
model-engine-file=../models/engines/ma_model_fp16_b3.plan
# MapAnything expects full-frame tensors; keep tensor meta for downstream hooks.
output-tensor-meta=1
# Dimensions are specified as C;H;W
infer-dims=3;384;640
network-input-order=0
maintain-aspect-ratio=0
unique-id=2

