[property]
# MapAnything full-frame SGIE (image input). Consumes RGB surfaces directly and
# emits tensor meta for depth post-processing (no tensor-from-meta input).
gpu-id=0
process-mode=1
# Generic full-frame depth tensor. Declaring this as a classifier can suppress
# the tensor meta that the DS8 MapAnything postprocess hook needs.
network-type=100
model-engine-file=/home/mayor/Noesis_Devel/models/mapanything_depth/1/model.plan
batch-size=3
gie-unique-id=2
network-mode=2
model-color-format=0
# Engine expects float inputs in the [0,1] range; scale 8-bit surfaces accordingly.
net-scale-factor=0.003921568627
input-tensor-from-meta=0
# MapAnything expects 16:9-ish inputs at 518×294 (W×H) for 1080p sources, aligned to patch size 14.
infer-dims=3;294;518
output-blob-names=depth;conf;mask
maintain-aspect-ratio=1
symmetric-padding=1
output-tensor-meta=1
