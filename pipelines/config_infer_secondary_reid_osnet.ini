[property]
# OSNet ReID secondary inference (per-object embeddings)
# - Runs as SGIE (process-mode=2) on person objects from the PGIE (operate-on-gie-id=1).
# - Emits raw tensor meta (output-tensor-meta=1) so DS8 hooks can consume embeddings
#   and assign appearance-based stable IDs across cameras.
gpu-id=0

# Model / engine
onnx-file=/home/mayor/Noesis_Devel/models/engines/reid_osnet_ibn_msmt17_dyn_b16.onnx
model-engine-file=/home/mayor/Noesis_Devel/models/engines/reid_osnet_ibn_msmt17_dyn_b16_fp16.engine

# Execution
batch-size=16
# 0=FP32, 1=INT8, 2=FP16
network-mode=2
gie-unique-id=3
process-mode=2
network-type=1

# Input preprocessing.
# The exported ONNX includes ImageNet mean/std normalization internally, so keep DS-side
# preprocessing neutral (RGB, no scaling/offsets) and feed float RGB in [0,255].
model-color-format=0
net-scale-factor=1.0
infer-dims=3;256;128
maintain-aspect-ratio=0

# Secondary targeting
operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=24
input-object-min-height=48

# Re-infer cadence: refresh embeddings several times per second at ~20fps.
secondary-reinfer-interval=2

# Outputs
output-tensor-meta=1
classifier-async-mode=0
