[property]
# ReIdentificationNet Transformer (Swin-Tiny, feature dim 256) secondary inference.
# - NVIDIA TAO reidentificationnet_transformer deployable_v1.0
#   (swin_tiny_market1501_aicity156_featuredim256.onnx), human-centric backbone
#   pretrained on ~3M person crops and fine-tuned for ReID.
# - Runs as SGIE (process-mode=2) on person objects from the PGIE (operate-on-gie-id=1).
# - Emits raw tensor meta (output-tensor-meta=1) so DS8 hooks can consume embeddings
#   and assign appearance-based stable IDs across cameras.
gpu-id=0

# Model / engine (paths resolve relative to this file's directory)
onnx-file=../models/onnx/reid_swin_tiny_market1501_aicity156_featuredim256.onnx
model-engine-file=../models/engines/reid_swin_tiny_aicity156_dyn_b16_fp16.engine

# Execution
batch-size=16
# 0=FP32, 1=INT8, 2=FP16
network-mode=2
gie-unique-id=3
process-mode=2
network-type=1

# Input preprocessing (TAO ReID: RGB, ImageNet mean/std).
# offsets = [123.675, 116.28, 103.53], scale = 1/57.63 = 0.01735207
model-color-format=0
net-scale-factor=0.01735207
offsets=123.675;116.28;103.53
infer-dims=3;256;128
# Direct resize to 256x128 matches TAO ReID training preprocessing.
maintain-aspect-ratio=0

# Secondary targeting
operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=24
input-object-min-height=48

# Re-infer cadence: StableID consumes at most ~1 embedding/s per track
# (NOESIS_REID_EMBED_INTERVAL_S), so a 12-frame reinfer interval still delivers
# fresh embeddings (~2.5/s at 30fps) at half the SGIE load. New objects are
# always inferred immediately regardless of this interval.
secondary-reinfer-interval=12

# Outputs (single output layer "fc_pred", 256-dim embedding)
output-tensor-meta=1
# DeepStream async classifier mode delays classifier output and leaves this
# tensor-meta extraction path without usable embeddings.
classifier-async-mode=0
