[property]
# YOLO26 pose SGIE (per-object crops; tensor meta only)
gpu-id=0
onnx-file=/home/mayor/Noesis_Devel/models/yolo26n-pose.onnx
model-engine-file=/home/mayor/Noesis_Devel/models/engines/yolo26n-pose_b16_fp16.engine
labelfile-path=/home/mayor/Noesis_Devel/testpipelines/yolo26-pose/labels.txt

# Execution
batch-size=16
network-mode=2
process-mode=2
network-type=100
gie-unique-id=4
classifier-async-mode=0
net-scale-factor=0.003921568627
model-color-format=0
infer-dims=3;640;640
maintain-aspect-ratio=1
symmetric-padding=1
scaling-filter=1
output-blob-names=output0
output-tensor-meta=1
# Enable host copy so pose tensor extraction uses host memory (avoids DLPack ownership hazards).
disable-output-host-copy=0

# Secondary targeting (person crops from PGIE)
operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=64
input-object-min-height=64

# Tensor-only SGIE: the Python pose hooks consume output tensor meta directly.
