[property]
# YOLO26 pose SGIE (per-object crops; tensor meta only)
gpu-id=0
onnx-file=/home/mayor/Noesis_Devel/models/yolo26n-pose.onnx
model-engine-file=/home/mayor/Noesis_Devel/models/engines/yolo26n-pose_b3_fp16.engine
labelfile-path=/home/mayor/Noesis_Devel/testpipelines/yolo26-pose/labels.txt

# Execution
batch-size=3
network-mode=2
process-mode=2
network-type=100
gie-unique-id=4
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=1
symmetric-padding=1
output-blob-names=output0
output-tensor-meta=1
disable-output-host-copy=1

# Secondary targeting (person crops from PGIE)
operate-on-gie-id=1
operate-on-class-ids=0
input-object-min-width=32
input-object-min-height=64

# Parser (tensor-only; empty detection list)
parse-bbox-func-name=NvDsInferParseYolo26Pose
custom-lib-path=/home/mayor/Noesis_Devel/pipelines/nvdsinfer_yolo26_pose/libnvdsinfer_yolo26_pose.so
