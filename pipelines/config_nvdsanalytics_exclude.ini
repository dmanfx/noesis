[property]
enable=1
# Disable plugin-drawn OSD for exclusion zones; we draw ROI in our per-branch OSD
osd-mode=0
display-font-size=4
# Use largest resolution to accommodate all streams
#config-width=1920
#config-height=1080

# --- Exclusion ROIs (Per Stream) ---

# Stream 0: Living Room Camera (1920x1080) - no exclusions currently
[roi-filtering-stream-0]
enable=1
roi-RF1=1100;210;1390;210;1390;400;1100;400
class-id=-1
inverse-roi=0
config-width=1920
config-height=1080

# Stream 1: Family Room Camera - exclusion covers wall photo
# Original coordinates scaled from 1280x720 to 1920x1080: multiply by 1.5
[roi-filtering-stream-1]
enable=1
#roi-RF1=986;68; 1215;122; 1205;275; 976;242
# Adjusted for 1920x1080 post-mux frame; aligned higher with wall picture frame
roi-RF1=900;130; 1080;130; 1080;260; 900;260
class-id=-1
inverse-roi=0 
config-width=1920
config-height=1080

# Stream 2: Kitchen Camera (1920x1080) - exclusion ROI (covers the 3 wall photos)  
[roi-filtering-stream-2]
enable=1
#roi-RF1=956;68; 1185;122; 1175;275; 946;242
roi-RF1=1434;102; 1777;183; 1762;412; 1419;363
class-id=-1
inverse-roi=0 
config-width=1920
config-height=1080
