[property]
enable=1
osd-mode=1
display-font-size=4
# Use largest resolution to accommodate all streams
config-width=1920
config-height=1080

# --- Exclusion ROIs (Per Stream) ---

# Stream 0: Living Room Camera (1920x1080) - no exclusions currently
[roi-filtering-stream-0]
enable=1
roi-RF1=100;100;200;200;200;300;100;300
class-id=-1
inverse-roi=0

# Stream 1: Kitchen Camera (1920x1080) - exclusion ROI (covers the 3 wall photos)  
[roi-filtering-stream-1]
enable=1
#roi-RF1=956;68; 1185;122; 1175;275; 946;242
roi-RF1=1434;102; 1777;183; 1762;412; 1419;363
class-id=-1
inverse-roi=0 

# Stream 2: Family Room Camera - exclusion covers wall photo
# Original coordinates scaled from 1280x720 to 1920x1080: multiply by 1.5
[roi-filtering-stream-2]
enable=1
#roi-RF1=956;68; 1185;122; 1175;275; 946;242
roi-RF1=1040;400; 1220;400; 1220;550; 1040;550
class-id=-1
inverse-roi=0 
