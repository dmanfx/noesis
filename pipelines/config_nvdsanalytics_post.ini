[property]
enable=1
osd-mode=0
display-font-size=12
# Use largest resolution to accommodate all streams
config-width=1920
config-height=1080

# --- Direction Detection (Per Stream) ---

# Stream 0: Living Room Camera (1920x1080)
[direction-detection-stream-0]
enable=1
# Define direction vectors scaled for 1920x1080
direction-North=960;300;960;150
direction-South=960;780;960;930
direction-East=750;540;900;540
direction-West=1170;540;1020;540
class-id=-1

# Stream 1: Kitchen Camera (1920x1080)
[direction-detection-stream-1]
enable=1
# Define direction vectors scaled for 1920x1080
direction-North=960;300;960;150
direction-South=960;780;960;930
direction-East=750;540;900;540
direction-West=1170;540;1020;540
class-id=-1

# Stream 2: Family Room Camera (1280x720) - scaled to 1920x1080 by muxer
[direction-detection-stream-2]
enable=1
# Define direction vectors (will be scaled by muxer from 1280x720 to 1920x1080)
direction-North=960;300;960;150
direction-South=960;780;960;930
direction-East=750;540;900;540
direction-West=1170;540;1020;540
class-id=-1

# --- Occupancy Analytics (Per Stream) ---

# Stream 0: Living Room Camera (1920x1080)
[overcrowding-stream-0]
enable=1
# Full-frame ROI for Living Room
roi-LivingRoom=0;0;1920;0;1920;1080;0;1080
object-threshold=1
class-id=0

# Stream 1: Kitchen Camera (1920x1080)
[overcrowding-stream-1]
enable=1
# Full-frame ROI for Kitchen
roi-Kitchen=0;0;1920;0;1920;1080;0;1080
object-threshold=1
class-id=0

# Stream 2: Family Room Camera (scaled to 1920x1080)
[overcrowding-stream-2]
enable=1
# Full-frame ROI for Family Room
roi-FamilyRoom=0;0;1920;0;1920;1080;0;1080
object-threshold=1
class-id=0
