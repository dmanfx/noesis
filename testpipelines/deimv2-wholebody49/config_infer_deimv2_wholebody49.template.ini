[property]
# DEIMv2 Wholebody49 instance model.
# The ONNX referenced here is a DS8 wrapper that bakes ImageNet mean/std into
# the graph, so DeepStream can keep GPU preprocessing to RGB + 1/255 scaling.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@
@INT8_CALIB_FILE@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=@INFER_INTERVAL@
gie-unique-id=@GIE_UNIQUE_ID@
process-mode=1
network-type=3
network-mode=@NETWORK_MODE@
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

cluster-mode=4
num-detected-classes=49
parse-bbox-instance-mask-func-name=NvDsInferParseDeimv2Wholebody49
custom-lib-path=@CUSTOM_LIB@
output-instance-mask=1
output-blob-names=label_xyxy_score;masks
segmentation-threshold=@MASK_THRESHOLD@

# Keep both model outputs available as tensor meta for the prototype summary
# and skeleton/attribute overlay probe. Decode, resize, infer, tiler, and OSD
# stay on the DS8/NVMM path; this terminal metadata read mirrors the other
# testpipelines that emit inspection artifacts.
output-tensor-meta=1

[class-attrs-all]
pre-cluster-threshold=@SCORE_THRESHOLD@
topk=300
nms-iou-threshold=0.45
