[property]
# DEIMv2 Wholebody49 label-only model.
# This variant prunes the mask head from ONNX/TensorRT and emits raw tensor
# metadata only. The prototype overlay still renders boxes/keypoints/skeletons.
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@
@INT8_CALIB_FILE@

gpu-id=0
batch-size=@BATCH_SIZE@
interval=@INFER_INTERVAL@
gie-unique-id=@GIE_UNIQUE_ID@
process-mode=1
network-type=100
network-mode=@NETWORK_MODE@
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=0
symmetric-padding=0

output-blob-names=label_xyxy_score
output-tensor-meta=1

[class-attrs-all]
pre-cluster-threshold=@SCORE_THRESHOLD@
topk=300
nms-iou-threshold=0.45
