[property]
# YOLO26 pose (raw tensor output; parsed in Python)
onnx-file=@ONNX_PATH@
model-engine-file=@ENGINE_PATH@
labelfile-path=@LABELS_PATH@

# Execution
gpu-id=0
batch-size=3
interval=0
gie-unique-id=1
process-mode=1
network-type=100
network-mode=2
net-scale-factor=0.003921568627
model-color-format=0
maintain-aspect-ratio=1
symmetric-padding=1
output-blob-names=output0

# Tensor output for Python pose overlay
output-tensor-meta=1
